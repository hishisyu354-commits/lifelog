<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="生活ログ" />
  <meta name="theme-color" content="#8b0026" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>生活ログMVP</title>
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8b0026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="生活ログ">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root,
    body[data-theme="red-light"] {
      --main:#8b0026; --sub:#74001f; --bg:#f5f6fa; --card:#fff; --text:#222; --muted:#666; --border:#e3e3e3; --soft-bg:#fafafa; --notice-bg:#fffae6; --notice-border:#e8d048;
      --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom); --safe-left:env(safe-area-inset-left); --safe-right:env(safe-area-inset-right);
    }
    body[data-theme="blue-light"] { --main:#1f5fa8; --sub:#15467f; --bg:#f0f4fa; --card:#fff; --text:#1a1a1a; --muted:#666; --border:#dde4ee; --soft-bg:#f7faff; --notice-bg:#eff5ff; --notice-border:#a8c5e8; }
    body[data-theme="green-light"] { --main:#1e7a48; --sub:#155a35; --bg:#f1f7f3; --card:#fff; --text:#1a1a1a; --muted:#666; --border:#dde8e0; --soft-bg:#f7fcf8; --notice-bg:#eef9f2; --notice-border:#a8d8b8; }
    body[data-theme="mono-light"] { --main:#333; --sub:#222; --bg:#f5f5f5; --card:#fff; --text:#1a1a1a; --muted:#666; --border:#e0e0e0; --soft-bg:#f9f9f9; --notice-bg:#f5f5f5; --notice-border:#bbb; }
    body[data-theme="red-dark"] { --main:#c93a52; --sub:#a82d40; --bg:#161616; --card:#222; --text:#e8e8e8; --muted:#aaa; --border:#3a3a3a; --soft-bg:#2a2a2a; --notice-bg:#3a2e15; --notice-border:#8a7335; }
    body[data-theme="blue-dark"] { --main:#5b9bd5; --sub:#3f7ab5; --bg:#101620; --card:#1e2632; --text:#e8e8e8; --muted:#aaa; --border:#34404e; --soft-bg:#252e3c; --notice-bg:#1f2c3e; --notice-border:#3f5670; }
    body[data-theme="green-dark"] { --main:#46c47a; --sub:#38a564; --bg:#0f1815; --card:#1d2622; --text:#e8e8e8; --muted:#aaa; --border:#324038; --soft-bg:#252e29; --notice-bg:#1a2e22; --notice-border:#3f6651; }
    body[data-theme="mono-dark"] { --main:#bbb; --sub:#999; --bg:#121212; --card:#1e1e1e; --text:#e8e8e8; --muted:#999; --border:#333; --soft-bg:#262626; --notice-bg:#2a2a2a; --notice-border:#555; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior-y: contain; -webkit-text-size-adjust: 100%; }
    html { background: #d8d8d8; }
    body { margin:0 auto; max-width:480px; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--text); padding-bottom: calc(78px + var(--safe-bottom)); box-shadow: 0 0 24px rgba(0,0,0,.12); position:relative; }
    header { background:var(--main); color:#fff; padding:calc(14px + var(--safe-top)) max(14px, var(--safe-right)) 14px max(14px, var(--safe-left)); text-align:center; font-size:23px; font-weight:800; min-height:calc(56px + var(--safe-top)); display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
    .header-title { display:inline-block; }
    .sync-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.18); color:#fff; line-height:1.2; cursor:default; user-select:none; }
    .sync-badge .sync-icon { font-size:12px; }
    .sync-badge-busy { background:rgba(255,255,255,.22); }
    .sync-badge-busy .sync-icon { animation:syncSpin 1.1s linear infinite; display:inline-block; }
    .sync-badge-ok { background:rgba(46,204,113,.30); }
    .sync-badge-err { background:rgba(231,76,60,.45); cursor:pointer; }
    @keyframes syncSpin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

    /* トースト通知 */
    .save-toast { position:fixed; bottom:120px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(20,20,20,.9); color:#fff; padding:11px 22px; border-radius:22px; font-size:13px; font-weight:600; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:9999; max-width:80%; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.2); }
    .save-toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }

    /* マイクボタン（音声入力） */
    .mic-btn { background:#f3f3f3; color:#444; border:1px solid #ddd; padding:7px 12px; border-radius:10px; font-size:16px; cursor:pointer; line-height:1; min-height:36px; min-width:42px; display:inline-flex; align-items:center; justify-content:center; gap:4px; }
    .mic-btn:active { transform:scale(.95); }
    .mic-btn.mic-active { background:#e74c3c; color:#fff; border-color:#e74c3c; animation:micPulse 1.2s ease-in-out infinite; }
    .mic-label { font-size:11px; font-weight:600; }
    @keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.55)} 50%{box-shadow:0 0 0 10px rgba(231,76,60,0)} }
    .mic-row { display:flex; gap:6px; align-items:center; margin-top:4px; }

    /* 振り返り画面スワイプアニメ */
    #reviewScreen { transition:transform .26s ease, opacity .26s ease; will-change:transform, opacity; }
    #reviewScreen.review-slide-left { transform:translateX(-30%); opacity:0; }
    #reviewScreen.review-slide-right { transform:translateX(30%); opacity:0; }
    #reviewScreen.review-slide-in-from-left { transform:translateX(-30%); opacity:0; transition:none; }
    #reviewScreen.review-slide-in-from-right { transform:translateX(30%); opacity:0; transition:none; }

    /* やめたことログ */
    .quit-item { background:#fafafa; border:1px solid #e3e3e3; border-radius:12px; padding:14px; margin-bottom:12px; border-left:4px solid #b58068; }
    .quit-title { font-weight:800; font-size:15px; margin-bottom:6px; }
    .quit-period { font-size:12px; color:#888; margin-bottom:6px; }
    .quit-reason { font-size:13px; color:#444; line-height:1.5; padding:6px 0; border-top:1px dashed #ddd; margin-top:6px; }

    /* カテゴリ管理 */
    .category-list { margin:10px 0 18px; }
    .category-row-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fafafa; border:1px solid #e3e3e3; border-radius:10px; margin-bottom:6px; }
    .category-row-name { font-weight:700; font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .category-row-count { font-size:12px; color:#888; }

    /* 重複ログチェック */
    .dup-pair { background:#fffaf0; border:1px solid #ffd89e; border-radius:12px; padding:12px; margin-bottom:14px; }
    .dup-header { font-weight:800; font-size:13px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #ffd89e; }
    .dup-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .dup-side { background:#fff; border-radius:8px; padding:10px; border:1px solid #f0e0c0; }
    .dup-meta { font-size:11px; color:#666; font-weight:700; margin-bottom:4px; }
    .dup-detail { font-size:11px; color:#444; padding:5px 0; line-height:1.4; }
    .dup-detail-empty { font-size:11px; color:#bbb; padding:5px 0; }
    @media(max-width:9999px){
      .dup-row { grid-template-columns:1fr; }
    }

    /* 配色テーマ選択 */
    .theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 20px; }
    .theme-card { display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--soft-bg); border:2px solid var(--border); border-radius:14px; padding:14px 10px; cursor:pointer; min-height:90px; color:var(--text); font-weight:700; transition:transform .08s; position:relative; }
    .theme-card:active { transform:scale(.96); }
    .theme-card.theme-active { border-color:var(--main); background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.08); }
    .theme-swatch { width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,255,255,.6); box-shadow:0 1px 3px rgba(0,0,0,.15); }
    .theme-name { font-size:12px; font-weight:700; text-align:center; line-height:1.3; }
    .theme-check { position:absolute; top:6px; right:8px; font-size:18px; color:var(--main); font-weight:900; }

    /* 週次振り返り */
    .weekly-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0 16px; padding:8px 10px; background:var(--soft-bg); border-radius:10px; }
    .weekly-period { font-weight:800; font-size:14px; flex:1; text-align:center; }
    .weekly-summary-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:10px 0 18px; }
    .weekly-stat { background:var(--soft-bg); border:1px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center; }
    .weekly-stat-label { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px; }
    .weekly-stat-value { font-size:22px; font-weight:800; color:var(--main); line-height:1; }
    .weekly-stat-value span { font-size:11px; color:var(--muted); margin-left:2px; font-weight:600; }
    .weekly-top-item { display:flex; align-items:center; gap:10px; background:var(--soft-bg); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
    .weekly-top-rank { width:28px; height:28px; border-radius:50%; background:var(--main); color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .weekly-top-body { flex:1; min-width:0; }
    .weekly-top-title { font-weight:700; font-size:14px; line-height:1.4; }
    .weekly-top-meta { font-size:11px; color:var(--muted); margin-top:2px; }
    .weekly-top-score { font-size:20px; font-weight:800; color:var(--main); flex-shrink:0; min-width:32px; text-align:right; }

    /* タブの未入力バッジ */
    .tab-badge { position:absolute; top:6px; right:calc(50% - 22px); background:#e74c3c; color:#fff; font-size:10px; font-weight:800; min-width:18px; height:18px; border-radius:9px; padding:0 5px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.2); line-height:1; pointer-events:none; }

    /* 繰り返し曜日ピッカー */
    .weekday-picker { display:flex; gap:5px; flex-wrap:nowrap; width:100%; margin-top:6px; margin-bottom:8px; }
    .weekday-cell { flex:1 1 0; min-width:0; height:44px; border-radius:10px; background:var(--soft-bg); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700; font-size:14px; position:relative; user-select:none; transition:transform .08s, background .15s, color .15s, border-color .15s; margin:0; padding:0; color:var(--text); }
    .weekday-cell input { position:absolute; opacity:0; pointer-events:none; width:0; height:0; }
    .weekday-cell:active { transform:scale(.92); }
    .weekday-cell.checked,
    .weekday-cell:has(input:checked) { background:var(--main); color:#fff; border-color:var(--main); }

    /* スコープ切替（日次/週次/月次） */
    .scope-switcher { display:flex; gap:0; margin:0 0 18px; background:var(--soft-bg); border:1px solid var(--border); border-radius:12px; padding:4px; }
    .scope-btn { flex:1; padding:9px 4px; border:none; background:transparent; color:var(--muted); font-weight:700; font-size:13px; border-radius:8px; cursor:pointer; min-height:38px; transition:background .15s, color .15s; }
    .scope-btn:active { transform:scale(.97); }
    .scope-btn.active { background:var(--main); color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); }

    /* 月次トレンドチャート */
    .monthly-trend-svg { width:100%; height:auto; max-width:340px; display:block; margin:8px auto; }
    .intent-match-summary { background:var(--soft-bg); border-left:3px solid var(--main); padding:8px 12px; border-radius:6px; font-size:12px; margin-top:10px; color:var(--text); }
    .intent-card { background:var(--soft-bg); border:1px solid var(--border); border-left:4px solid var(--main); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
    .intent-card-label { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:6px; }
    .intent-card-text { font-size:14px; line-height:1.6; color:var(--text); white-space:pre-wrap; }
    .intent-keywords-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .intent-kw-chip { display:inline-flex; align-items:center; padding:3px 9px; background:var(--card); border:1px solid var(--main); color:var(--main); border-radius:999px; font-size:11px; font-weight:700; }
    .intent-fact-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
    .intent-fact-label { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px; }
    .intent-fact-total { font-size:13px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--border); }
    .intent-fact-total strong { color:var(--main); }
    .intent-fact-keywords { display:flex; flex-direction:column; gap:5px; }
    .intent-kw-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; }
    .intent-kw-meta { font-size:11px; color:var(--muted); font-weight:600; }
    .intent-logs-expand { margin-top:8px; }
    .intent-logs-expand summary { cursor:pointer; font-size:12px; font-weight:700; color:var(--main); padding:8px 0; }
    .intent-log-item { background:var(--soft-bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-top:6px; }
    .intent-log-meta { font-size:11px; color:var(--muted); margin-bottom:2px; }
    .intent-log-title { font-size:13px; font-weight:700; line-height:1.4; }

    /* ホーム画面追加 促進バナー */
    .pwa-banner { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(82px + var(--safe-bottom)); width:calc(100% - 24px); max-width:456px; background:var(--card); color:var(--text); border:1px solid var(--border); border-left:4px solid var(--main); border-radius:12px; padding:12px 38px 12px 14px; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:9998; display:flex; align-items:center; gap:10px; animation:pwaBannerIn .35s ease; }
    .pwa-banner-icon { font-size:22px; flex-shrink:0; }
    .pwa-banner-body { flex:1; min-width:0; }
    .pwa-banner-title { font-weight:800; font-size:13px; margin-bottom:2px; color:var(--main); }
    .pwa-banner-text { font-size:11.5px; color:var(--muted); line-height:1.4; }
    .pwa-banner-close { position:absolute; top:8px; right:8px; width:26px; height:26px; min-height:26px; padding:0; background:transparent; color:var(--muted); border:none; font-size:20px; line-height:1; cursor:pointer; border-radius:6px; }
    .pwa-banner-close:active { background:var(--soft-bg); }
    @keyframes pwaBannerIn { from{opacity:0; transform:translate(-50%, 20px);} to{opacity:1; transform:translate(-50%, 0);} }
    .category-pie-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:6px 0; }
    .category-pie-svg { width:200px; height:200px; flex-shrink:0; }
    .category-pie-legend { width:100%; }
    .legend-row { display:grid; grid-template-columns:14px 1fr 60px 50px 42px; gap:6px; align-items:center; padding:5px 4px; font-size:12px; }
    .legend-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
    .legend-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .legend-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
    .legend-bar-fill { display:block; height:100%; border-radius:3px; }
    .legend-val { text-align:right; font-weight:600; color:var(--muted); font-size:11px; }
    .legend-pct { text-align:right; font-weight:700; font-size:11px; }
    .today-bar { background:var(--sub); color:#fff; text-align:center; padding:0 max(14px, var(--safe-right)) 14px max(14px, var(--safe-left)); font-size:14px; font-weight:600; }
    main { max-width:1180px; margin:0 auto; padding:18px max(18px, var(--safe-right)) 18px max(18px, var(--safe-left)); }
    .layout { display:grid; grid-template-columns:1fr; gap:12px; align-items:start; }
    .card { background:var(--card); color:var(--text); border-radius:16px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:16px; }
    h2 { margin:0 0 14px; font-size:20px; }
    .small { font-size:13px; color:var(--muted); line-height:1.7; }
    .empty { color:#777; line-height:1.7; background:#fafafa; border-radius:12px; padding:14px; }
    .notice { background:#fff6d6; border-left:7px solid #f1c40f; border-radius:10px; padding:12px; margin-top:12px; line-height:1.6; }
    .title-with-info { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .title-with-info h2 { margin:0; }
    .info-btn { width:26px; height:26px; border-radius:50%; background:#eee; border:none; color:#555; font-size:14px; font-weight:800; font-style:italic; font-family:Georgia,serif; padding:0; min-height:26px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
    .info-btn:active { transform:scale(.9); background:#ddd; }
    .info-hint { display:none; background:#fff6d6; border-left:5px solid #f1c40f; border-radius:8px; padding:10px 12px; margin:0 0 12px; font-size:13px; line-height:1.6; color:#555; }
    .info-hint.show { display:block; animation:infoHintShow .15s ease; }
    @keyframes infoHintShow { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

    .menu-section-title { font-size:13px; font-weight:800; color:#888; margin:20px 0 8px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1px solid #eee; padding-bottom:6px; }
    #gcalSection p { margin:6px 0; }
    #gcalSection input { margin-top:8px; }
    .gcal-synced-badge { display:inline-block; font-size:10px; background:#27ae60; color:#fff; padding:2px 7px; border-radius:999px; font-weight:800; margin-left:6px; vertical-align:middle; }
    .gcal-info-row { background:#f6f8fa; border:1px solid #e3e3e3; border-radius:10px; padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.6; }
    .gcal-info-row strong { color:var(--main); }
    .apply-divider { height:1px; background:var(--border); margin:18px 0 14px; }
    .apply-link-btn { display:inline-block; padding:11px 18px; background:var(--soft-bg); border:2px solid var(--main); color:var(--main); border-radius:12px; font-weight:700; font-size:14px; text-decoration:none; text-align:center; min-height:44px; line-height:1.4; }
    .apply-link-btn:active { transform:scale(.97); }

    /* 月間カレンダー日付タップ時のコンテキストメニュー（PC右クリック風） */
    .date-context-overlay {
      position: fixed; inset: 0; background: transparent; z-index: 200;
    }
    .date-context-menu {
      position: fixed; z-index: 201;
      background: #fff; border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06);
      padding: 6px; min-width: 168px; max-width: 200px;
      opacity: 0; transform: scale(.94); transform-origin: top left;
      transition: opacity .12s ease, transform .12s ease;
    }
    .date-context-menu.show { opacity: 1; transform: scale(1); }
    .dcm-header {
      font-size: 12px; font-weight: 800; color: var(--main);
      padding: 6px 10px 8px; border-bottom: 1px solid #eee; margin-bottom: 4px;
    }
    .dcm-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 9px 10px; border-radius: 7px;
      background: transparent; border: none; cursor: pointer;
      font-size: 13.5px; font-weight: 600; color: #222;
      text-align: left; min-height: 38px;
    }
    .dcm-item:active { background: #f0f0f0; }
    .dcm-item .dcm-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .dcm-item.dcm-plan { color: #2477b8; }
    .dcm-item.dcm-actual { color: #1e8a4a; }
    .dcm-item.dcm-review { color: var(--main); }

    /* カスタム確認ダイアログ（iOS Safari の confirm() 不具合対策） */
    .custom-confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background .2s ease;
    }
    .custom-confirm-overlay.show { background: rgba(0,0,0,.55); }
    .custom-confirm-box {

      border-radius:8px;
      border:1px solid #ddd;
      margin-bottom:8px;
      font-size:14px;
      box-sizing:border-box;
      min-height:38px;
    }


    .untitled-smart-note{
      display:none; /* 過剰な説明なので非表示 */
    }
    .untitled-option.smart-top{
      border-color:#f0a6b8;
      background:#fff1f4;
    }
    .untitled-score-label{
      font-size:9px;
      color:#8b0026;
      font-weight:900;
      margin-left:1px;
    }

    .untitled-section-title{
      font-size:11px;
      font-weight:900;
      color:#8b0026;
      margin:8px 0 4px;
      letter-spacing:.02em;
    }
    .untitled-recent{
      border-color:#f3c0cd;
      background:#fff;
    }

    .untitled-save-btn{
      width:100%;
      background:#8b0028;
      color:white;
      border:none;
      border-radius:10px;
      padding:11px;
      font-size:14px;
      font-weight:800;
      min-height:44px;
    }

    .bottom-nav {
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      max-width:480px;
      background:#ffffff;
      border-top:1px solid #e8e8e8;
      box-shadow:0 -2px 12px rgba(0,0,0,.06);
      display:flex;
      z-index:85;
      padding-left:var(--safe-left);
      padding-right:var(--safe-right);
      padding-bottom:var(--safe-bottom);
    }
    .nav-tab {
      flex:1;
      background:transparent;
      color:#888;
      border:none;
      padding:8px 4px 6px;
      min-height:62px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
      gap:3px;
      font-size:10px;
      font-weight:700;
      border-radius:0;
      position:relative;
      transition:color .15s, opacity .15s;
      opacity:.62;
    }
    .nav-tab.active {
      color:var(--main);
      opacity:1;
    }
    .nav-tab.active::before {
      content:"";
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:32px;
      height:3px;
      background:var(--main);
      border-radius:0 0 4px 4px;
    }
    .nav-tab:active {
      transform:scale(.94);
      opacity:.75;
    }
    .nav-icon {
      font-size:22px;
      line-height:1;
    }
    .nav-label {
      font-size:10px;
      white-space:nowrap;
      letter-spacing:.5px;
    }

    /* 振り返り画面の×ボタン（カレンダータブ内でreview表示時のみ表示） */
    .close-review-btn {
      position:fixed;
      top:calc(86px + var(--safe-top));
      right:max(calc(14px + var(--safe-right)), calc(50% - 240px + 14px));
      width:42px;
      height:42px;
      border-radius:50%;
      background:#fff;
      color:#444;
      font-size:22px;
      font-weight:300;
      line-height:1;
      padding:0;
      box-shadow:0 4px 14px rgba(0,0,0,.18);
      display:none;
      z-index:88;
      align-items:center;
      justify-content:center;
      min-height:42px;
      border:1px solid #eee;
    }
    .close-review-btn:active { transform:scale(.9); }
    body[data-active-tab="calendar"][data-show-review="true"] .close-review-btn { display:flex; }

    /* タブ別の表示制御：カレンダータブ以外では左ペイン（カレンダー）を非表示 */
    body:not([data-active-tab="calendar"]) .left-pane { display:none; }

    .backup-file { display:none; }
    @media(max-width:9999px){
      main{padding:12px max(12px, var(--safe-right)) 12px max(12px, var(--safe-left))}
      .layout{gap:12px}
      .card{padding:14px;margin-bottom:12px}
      /* 月間カレンダー画面のcardは余白を詰めて表示幅を確保 */
      body[data-active-tab="calendar"]:not([data-show-review="true"]) main{padding:12px 6px}
      body[data-active-tab="calendar"]:not([data-show-review="true"]) .left-pane.card{padding:10px 6px}
      .day-cell{min-height:82px;padding:3px 2px;border-radius:6px}
      .day-number{font-size:12px}
      .calendar-grid{gap:1px}
      .month-page{gap:1px;padding:0 1px}
      .weekday-row{gap:1px}
      .day-plan-chip{font-size:10px;padding:1px 3px;border-radius:3px}
      .day-plan-more{font-size:9px}
      .clock-wrapper{width:280px;height:280px}
      .clock-ring{width:210px;height:210px}
      .clock-ring:after{inset:47px}
      .row{grid-template-columns:1fr}
      .log-content-row{align-items:flex-start;flex-direction:column}
      .mini-actions{flex-direction:row;width:100%;margin-top:8px}
      .mini-actions button{flex:1}
      .weekday-checks{grid-template-columns:repeat(4,1fr)}
      h2{font-size:18px}
      .score-cell{height:36px;font-size:12px;gap:3px}
      .score-bar{gap:3px}

      /* 週間タイムテーブルをスマホ画面に収める */
      .card{padding:12px}
      .week-grid{margin:0 -8px;}
      .week-hint{font-size:10px;line-height:1.4;margin:0 0 6px;padding:0 2px;}
      .week-timegrid-scroll{overflow-x:hidden;border-radius:8px;}
      .week-timegrid{min-width:0;}
      .week-timegrid-header,
      .week-timegrid-body{grid-template-columns:28px repeat(7, 1fr);}
      .week-time-col-header{}
      .week-day-col-header{padding:6px 2px;min-height:48px;gap:2px;}
      .week-day-col-name{font-size:10px;}
      .week-day-col-num{font-size:14px;}
      .week-day-col-header.today .week-day-col-num{width:24px;height:24px;font-size:12px;}
      .week-time-label{font-size:9px;right:3px;font-weight:600;}
      .week-event{left:1px;right:1px;padding:2px 3px;border-radius:4px;}
      .week-event-time{font-size:8px;}
      .week-event-text{font-size:9px;-webkit-line-clamp:2;line-height:1.15;}

      /* モバイル時のタブ切替表示制御：カレンダータブも切替式 */
      body[data-active-tab="calendar"]:not([data-show-review="true"]) .right-pane { display:none; }
      body[data-active-tab="calendar"][data-show-review="true"] .left-pane { display:none; }
    }
  </style>
</head>
<body>
  <header>
    <span class="header-title">生活ログMVP</span>
    <span id="syncBadge" class="sync-badge" style="display:none;"></span>
  </header>
  <div id="todayBar" class="today-bar"></div>

  <div id="liveStopwatchBar" class="live-stopwatch-bar">
    <div class="live-left">
      <span class="live-dot"></span>
      <span>計測中</span>
    </div>

    <div class="live-center">
      <div id="liveStopwatchTime">00:00:00</div>
      <div class="live-sub">無題・カテゴリなしで即保存</div>
    </div>

    <button class="live-send-btn" onclick="quickSendStopwatch()">
      送信
    </button>
  </div>


  <main>
    <div class="layout">
      <section class="card left-pane">
        <div class="view-toggle-row">
          <button class="toggle-view-btn" onclick="toggleCalendarView()">
            <span class="toggle-view-icon">▤</span>
            <span id="viewToggleLabel">週間予定へ</span>
          </button>
        </div>
        <div class="calendar-header">
          <div id="calendarTitle" class="calendar-title"></div>
          <button class="today-jump-btn" onclick="jumpToToday()" aria-label="今日へ">今日</button>
        </div>
        <!-- 月間ビュー：曜日行 + スライダー（3面：前月/当月/翌月） -->
        <div id="monthCalendarArea">
          <div class="weekday-row">
            <div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div>
          </div>
          <div id="monthViewport" class="month-viewport">
            <div id="monthSlider" class="month-slider">
              <div class="month-page" id="monthPagePrev"></div>
              <div class="month-page" id="monthPageCurr"></div>
              <div class="month-page" id="monthPageNext"></div>
            </div>
          </div>
        </div>
        <!-- 週間ビュー（タイムテーブル）用 -->
        <div id="calendarGrid" class="calendar-grid"></div>
        <p class="small" style="margin:8px 2px 0;font-size:10.5px;color:#999;">日付タップで詳細・記録追加。左右スワイプで前後の月。</p>
      </section>

      <div class="right-pane">
        <section id="menuScreen" class="card">
          <h2>メニュー</h2>
          <p class="small">主要な画面は下のタブから、記録の追加は右下の「＋」ボタンから。それ以外の機能はここに集約しています。</p>

          <h3 class="menu-section-title">Googleカレンダー連携</h3>
          <div id="gcalSection"></div>

          <h3 class="menu-section-title">記録・振り返り</h3>
          <div class="menu" style="margin-top:14px;">
            <button class="light" onclick="showReflectionNotebook()">振り返りノート</button>
            <button class="light" onclick="showQuitList()">やめたことログ</button>
            <button class="secondary" onclick="showRepeatForm()">繰り返し予定の登録</button>
          </div>
          <p class="small" style="margin:6px 2px 0;color:#999;font-size:11px;">※ 日次・週次・月次の振り返りは「振り返り」タブから切り替えて見られます。</p>

          <h3 class="menu-section-title">データ整理</h3>
          <div class="menu" style="margin-top:14px;">
            <button class="light" onclick="showCategoryManager()">カテゴリ管理・統合</button>
            <button class="light" onclick="showDuplicateChecker()">重複ログをチェック</button>
            <button class="light" onclick="showBackupMenu()">データの書き出し/読み込み</button>
          </div>

          <h3 class="menu-section-title">表示設定</h3>
          <div class="menu" style="margin-top:14px;">
            <button class="light" onclick="showThemeSettings()">配色テーマ</button>
          </div>
          <p class="small" style="margin-top:14px;">データはこのブラウザ内に保存されます（Drive連携時は自動同期）。</p>
        </section>
        <section id="formScreen" class="card" style="display:none;"></section>
        <section id="reviewScreen" class="card" style="display:none;"></section>
      </div>
    </div>
  </main>

  <div class="fab-container">
    <div class="fab-menu" id="fabMenu">
      <button onclick="showActualForm(); closeFab();">
        <span class="fab-icon green">✓</span>
        <span>行動を追加</span>
      </button>
      <button onclick="showStopwatch(); closeFab();">
        <span class="fab-icon main">●</span>
        <span>ストップウォッチで記録</span>
      </button>
      <button onclick="showPlanForm(); closeFab();">
        <span class="fab-icon blue">＋</span>
        <span>予定を追加</span>
      </button>
    </div>
    <button class="fab" id="fabBtn" onclick="toggleFab()" aria-label="記録を追加">＋</button>
  </div>

  <button class="close-review-btn" id="closeReviewBtn" onclick="closeReview()" aria-label="カレンダーに戻る">×</button>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab active" data-tab="calendar" onclick="switchTab('calendar')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">カレンダー</span>
    </button>
    <button class="nav-tab" data-tab="today" onclick="switchTab('today')">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">振り返り</span>
    </button>
    <button class="nav-tab" data-tab="trend" onclick="switchTab('trend')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">推移</span>
    </button>
    <button class="nav-tab" data-tab="record" onclick="switchTab('record')">
      <span class="nav-icon">✏️</span>
      <span class="nav-label">記録</span>
    </button>
    <button class="nav-tab" data-tab="menu" onclick="switchTab('menu')">
      <span class="nav-icon">☰</span>
      <span class="nav-label">メニュー</span>
    </button>
  </nav>

  <script>
    const STORAGE_KEY = "dailyLifeLogsV6";
    const CATEGORY_KEY = "dailyLifeCategoriesV1";
    const TEMPLATE_KEY = "dailyLifeFrequentPlansV1";
    const TAG_KEY = "dailyLifeFrequentTagsV1";
    const SUMMARY_KEY = "dailyLifeDailySummariesV1";
    const STOPWATCH_KEY = "dailyLifeRunningStopwatchV1";
    const GCAL_CLIENT_ID_KEY = "dailyLifeGcalClientIdV1";
    const GCAL_TOKEN_KEY = "dailyLifeGcalTokenV1";
    const GCAL_USER_KEY = "dailyLifeGcalUserV1";
    const QUIT_KEY = "dailyLifeQuitItemsV1";
    const WEEKLY_INTENT_KEY = "dailyLifeWeeklyIntentsV1";
    const THEME_KEY = "dailyLifeThemeV1";
    const DEFAULT_CATEGORIES = [
      { id:"none", name:"カテゴリなし", color:"#95a5a6" },
      { id:"study", name:"勉強", color:"#3498db" },
      { id:"class", name:"授業", color:"#2ecc71" },
      { id:"meal", name:"食事・飲み会", color:"#e67e22" },
      { id:"hobby", name:"娯楽", color:"#9b59b6" },
      { id:"rest", name:"休息", color:"#1abc9c" },
      { id:"move", name:"移動", color:"#34495e" }
    ];
    const DEFAULT_TAGS = ["#集中", "#反省", "#学び", "#人間関係", "#成長実感"];
    let currentCalendarDate = new Date();
    let selectedDate = todayString();
    let stopwatchStart = null;
    let stopwatchInterval = null;

    function todayString(){ const d=new Date(); return toDateString(d); }
    function toDateString(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function formatDateJapanese(s){ const d=new Date(s+"T00:00:00"); const w=["日","月","火","水","木","金","土"][d.getDay()]; const [,m,day]=s.split("-"); return `${Number(m)}月${Number(day)}日（${w}）`; }
    function formatTime(d){ return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
    function formatDuration(ms){ const t=Math.floor(ms/1000); return `${String(Math.floor(t/3600)).padStart(2,"0")}:${String(Math.floor((t%3600)/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }
    function escapeHtml(str){ return String(str).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }

    function loadJSON(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
    function saveJSON(key, value){
      localStorage.setItem(key, JSON.stringify(value));
      if(!_suppressSyncTrigger && typeof SYNC_KEYS !== "undefined" && SYNC_KEYS.includes(key) && typeof triggerDriveSync === "function"){
        triggerDriveSync();
      }
    }
    let _suppressSyncTrigger = false;
    function loadLogs(){ return loadJSON(STORAGE_KEY, []); }
    function saveLogs(logs){ saveJSON(STORAGE_KEY, logs); }
    function loadCategories(){ const c=loadJSON(CATEGORY_KEY, null); if(c && c.length) return c; saveJSON(CATEGORY_KEY, DEFAULT_CATEGORIES); return DEFAULT_CATEGORIES; }
    function saveCategories(c){ saveJSON(CATEGORY_KEY, c); }
    function loadFrequentPlans(){ const p=loadJSON(TEMPLATE_KEY, null); if(p && p.length) return p; const d=["MOS資格勉強","数学の課題","英語課題","友達と飯","通学","休憩"]; saveJSON(TEMPLATE_KEY,d); return d; }
    function saveFrequentPlans(p){ saveJSON(TEMPLATE_KEY,p); }
    function loadFrequentTags(){ const t=loadJSON(TAG_KEY, null); if(t && t.length) return t; saveJSON(TAG_KEY,DEFAULT_TAGS); return DEFAULT_TAGS; }
    function loadDailySummaries(){ return loadJSON(SUMMARY_KEY, []); }
    function saveDailySummaries(summaries){ saveJSON(SUMMARY_KEY, summaries); }
    function loadQuitList(){ return loadJSON(QUIT_KEY, []); }
    function saveQuitList(list){ saveJSON(QUIT_KEY, list); }
    function loadWeeklyIntents(){ return loadJSON(WEEKLY_INTENT_KEY, []); }
    function saveWeeklyIntents(list){ saveJSON(WEEKLY_INTENT_KEY, list); }
    function getWeeklyIntent(weekStartDate){
      return loadWeeklyIntents().find(w => w.weekStartDate === weekStartDate) || null;
    }
    function upsertWeeklyIntent(weekStartDate, text, keywords){
      const all = loadWeeklyIntents();
      const idx = all.findIndex(w => w.weekStartDate === weekStartDate);
      const item = { weekStartDate, text, keywords, updatedAt: new Date().toISOString() };
      if(idx >= 0) all[idx] = item; else all.push(item);
      saveWeeklyIntents(all);
    }
    function saveFrequentTags(t){ saveJSON(TAG_KEY,t); }

    function getCategoryById(id){ return loadCategories().find(c=>c.id===id) || loadCategories()[0]; }
    function categoryOptions(selected="none"){ return loadCategories().map(c=>`<option value="${c.id}" ${c.id===selected?"selected":""}>${escapeHtml(c.name)}</option>`).join(""); }
    function frequentPlanOptions(){ return loadFrequentPlans().map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join(""); }
    function frequentTagOptions(){ return loadFrequentTags().map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join(""); }


    function updateLiveStopwatchBar(){
      const running = loadRunningStopwatch();
      const bar = document.getElementById("liveStopwatchBar");

      if(!bar) return;

      if(!running || !running.startAt){
        bar.style.display = "none";
        return;
      }

      bar.style.display = "flex";

      const start = new Date(running.startAt);
      const diff = Date.now() - start.getTime();

      document.getElementById("liveStopwatchTime").textContent =
        formatDuration(diff);
    }

    function quickSendStopwatch(){
      const running = loadRunningStopwatch();

      if(!running || !running.startAt){
        alert("現在計測中ではありません");
        return;
      }

      const startObj = new Date(running.startAt);
      const endObj = new Date();

      const logs = loadLogs();

      logs.push({
        id: Date.now(),
        date: toDateString(startObj),
        type: "actual",
        text: "無題",
        start: formatTime(startObj),
        end: formatTime(endObj),
        categoryId: "none",
        detail: ""
      });

      saveLogs(logs);

      clearRunningStopwatch();
      clearStopwatchTimer();
      stopwatchStart = null;

      updateLiveStopwatchBar();

      alert("無題ログとして保存しました");

      renderCalendar();

      if(typeof showReview === "function"){
        showReview(toDateString(startObj));
      }
    }


    function updateTodayBar(){ document.getElementById("todayBar").textContent = `今日：${formatDateJapanese(todayString())}`; }
    function hideRightPanels(){ ["menuScreen","formScreen","reviewScreen"].forEach(id=>document.getElementById(id).style.display="none"); }

    // ボトムタブ切替（メイン画面ナビゲーション）
    let currentTab = "calendar";
    let navigationContext = null; // "monthCalendar"等：保存・キャンセル後の戻り先を制御
    function switchTab(tab){
      currentTab = tab;
      navigationContext = null; // タブ切替で戻り先コンテキストはリセット
      document.body.dataset.activeTab = tab;
      document.body.dataset.showReview = "false";
      if(tab !== "today") _fromTodayTab = false;
      document.querySelectorAll(".nav-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      closeFab();
      hideRightPanels();
      switch(tab){
        case "calendar":
          document.getElementById("menuScreen").style.display = "none";
          renderCalendar();
          break;
        case "today":
          {
            _fromTodayTab = true;
            _todayScope = "day"; // 毎回日次デフォルト
            _weeklyOffsetWeeks = 0;
            _monthlyOffsetMonths = 0;
            const today = todayString();
            selectedDate = today;
            currentCalendarDate = new Date(today + "T00:00:00");
            showReview(today);
          }
          break;
        case "trend":
          showFulfillmentTrend();
          break;
        case "record":
          showRecordMenu();
          break;
        case "menu":
          document.getElementById("menuScreen").style.display = "block";
          break;
      }
      scrollToTopMobile();
    }

    // showMenuは「現在のタブのトップ画面に戻る」を意味する
    // メニュータブから来たならメニューへ、推移タブからなら推移へ、それ以外はカレンダーへ
    function showMenu(){
      hideRightPanels();
      if(currentTab === "menu"){
        document.body.dataset.showReview = "false";
        const m = document.getElementById("menuScreen");
        if(m) m.style.display = "block";
        scrollToTopMobile();
        return;
      }
      if(currentTab === "trend"){
        if(typeof showFulfillmentTrend === "function") showFulfillmentTrend();
        else switchTab("calendar");
        return;
      }
      if(currentTab === "record"){
        if(typeof showRecordMenu === "function") showRecordMenu();
        else switchTab("calendar");
        return;
      }
      // calendar / today / その他 → カレンダーへ
      switchTab("calendar");
    }

    // 記録タブ：予定/行動/SWへの導線をreviewScreenに表示
    function showRecordMenu(){
      hideRightPanels();
      const r = document.getElementById("reviewScreen");
      r.style.display = "block";
      r.innerHTML = `
        <h2>記録する</h2>
        <p class="small">今からの予定、過去にやった行動、または計測中の行動を記録できます。</p>
        <div class="menu" style="margin-top:14px;">
          <button class="green" onclick="showActualForm()">✓ 行動を追加</button>
          <button onclick="showStopwatch()">● ストップウォッチで記録</button>
          <button class="blue" onclick="showPlanForm()">＋ 予定を追加</button>
        </div>
      `;
    }

    // 保存・キャンセル後の戻り先を、現在のタブ/ビューに応じて決定する
    function navigateAfterSave(date){
      // 月間カレンダーのアクションシート経由 → カレンダー画面に戻る
      if(navigationContext === "monthCalendar"){
        navigationContext = null;
        document.body.dataset.showReview = "false";
        hideRightPanels();
        renderCalendar();
        scrollToTopMobile();
        return;
      }
      // 週間ビュー → そのまま週間ビューに戻る（振り返り画面に飛ばさない）
      if(currentTab === "calendar" && calendarViewMode === "week"){
        document.body.dataset.showReview = "false";
        hideRightPanels();
        renderCalendar();
        scrollToTopMobile();
        return;
      }
      // 記録タブ → 記録メニューに戻る
      if(currentTab === "record"){
        showRecordMenu();
        return;
      }

      overlay.addEventListener("click", closeDateContextMenu);
      document.body.appendChild(overlay);

      // メニュー本体
      const menu = document.createElement("div");
      menu.id = "dateContextMenu";
      menu.className = "date-context-menu";
      const d = new Date(date + "T00:00:00");
      const dow = ["日","月","火","水","木","金","土"][d.getDay()];
      menu.innerHTML = `
        <div class="dcm-header">${d.getMonth()+1}月${d.getDate()}日（${dow}）</div>

        <button class="dcm-item dcm-review" type="button"><span class="dcm-icon">📖</span>振り返り</button>
      `;
      document.body.appendChild(menu);

      // 各項目にイベント設定（onclick属性 + addEventListener 多重防御）
      const items = menu.querySelectorAll(".dcm-item");
      const actions = [
        () => { closeDateContextMenu(); navigationContext='monthCalendar'; showPlanForm(date); },
        () => { closeDateContextMenu(); navigationContext='monthCalendar'; showActualForm(date); },
        () => { closeDateContextMenu(); document.body.dataset.showReview='true'; showReview(date); }
      ];
      items.forEach((it, i) => {
        it.addEventListener("click", actions[i]);
        it.addEventListener("touchend", (e) => { e.preventDefault(); actions[i](); });
      });

      // 位置決め
      // 後でレイアウトを取得するため、まず非表示状態で計測
      const rect = anchorEl ? anchorEl.getBoundingClientRect() : null;
      const menuW = 180, menuH = menu.offsetHeight || 170;
      const vw = window.innerWidth, vh = window.innerHeight;
      let left, top;
      if(rect){
        // セルの右下から少しずらす（PC右クリック風）
        left = rect.right - 8;
        top = rect.bottom + 4;
        // 右側にはみ出すなら左寄りに
        if(left + menuW > vw - 8){ left = rect.left + 8; menu.style.transformOrigin = "top right"; }
        if(left + menuW > vw - 8){ left = vw - menuW - 8; }
        if(left < 8) left = 8;
        // 下にはみ出すなら上に出す
        if(top + menuH > vh - 90){
          top = rect.top - menuH - 4;
          menu.style.transformOrigin = (left > rect.left ? "bottom left" : "bottom right");
        }
        if(top < 60) top = 60;
      } else {
        left = (vw - menuW) / 2;
        top = (vh - menuH) / 2;
      }
      menu.style.left = left + "px";
      menu.style.top = top + "px";

      requestAnimationFrame(() => menu.classList.add("show"));
    }

    let _customConfirmCallback = null;
    function customConfirm(message, onConfirm, okLabel = "OK", okClass = "cc-ok"){
      closeCustomConfirm();
      _customConfirmCallback = onConfirm;
      const overlay = document.createElement("div");
      overlay.id = "customConfirmOverlay";
      overlay.className = "custom-confirm-overlay";
      overlay.setAttribute("onclick", "if(event.target===this) closeCustomConfirm()");
      overlay.innerHTML = `
        <div class="custom-confirm-box">
          <div class="cc-message"></div>
          <div class="cc-actions">
            <button type="button" class="cc-cancel" onclick="closeCustomConfirm()">キャンセル</button>
            <button type="button" class="${okClass} cc-ok-action" onclick="executeCustomConfirm()">${escapeHtml(okLabel)}</button>
          </div>
        </div>
      `;
      overlay.querySelector(".cc-message").textContent = message;
      document.body.appendChild(overlay);
      // 多重防御：addEventListener も追加（onclick が iOS で発火しない場合の保険）
      const okBtn = overlay.querySelector(".cc-ok-action");
      const cancelBtn = overlay.querySelector(".cc-cancel");
      if(okBtn){
        okBtn.addEventListener("click", executeCustomConfirm);
        okBtn.addEventListener("touchend", function(e){ e.preventDefault(); executeCustomConfirm(); });
      }
      if(cancelBtn){
        cancelBtn.addEventListener("click", closeCustomConfirm);

      }
      requestAnimationFrame(() => overlay.classList.add("show"));
    }
    let _ccExecuting = false;
    function executeCustomConfirm(){
      if(_ccExecuting) return; // 二重実行防止
      _ccExecuting = true;
      setTimeout(() => { _ccExecuting = false; }, 800);
      // デバッグ：呼び出し検知
      const debugMsg = "[debug] executeCustomConfirm called. callback=" + (typeof _customConfirmCallback);
      console.log(debugMsg);
      const callback = _customConfirmCallback;
      _customConfirmCallback = null;
      closeCustomConfirm();
      if(typeof callback === "function"){
        try { callback(); } catch(e){
          alert("削除処理でエラー：" + (e && e.message ? e.message : e));
        }
      } else {
        alert("コールバックが見つかりません（" + debugMsg + "）");

    }

    function getSmartDefaultTimes(date){
      const today=todayString();
      let sh,sm;
      if(date===today){
        const now=new Date();
        let h=now.getHours(), m=now.getMinutes();
        m=Math.ceil(m/15)*15;
        if(m>=60){ h+=1; m=0; }
        if(h>=24){ h=23; m=45; }
        sh=h; sm=m;
      } else {
        sh=9; sm=0;
      }
      let eh=sh+1, em=sm;
      if(eh>=24){ eh=23; em=59; }
      const pad=n=>String(n).padStart(2,"0");
      return { start:`${pad(sh)}:${pad(sm)}`, end:`${pad(eh)}:${pad(em)}` };
    }

        noon:["昼食","授業","友達と会話","課題","休憩","移動"],
        afternoon:["授業","課題","MOS資格勉強","図書館","バイト","ジム"],
        night:["食事","友達と会話","飲み会","YouTube","課題","帰宅"]
      };
      return map[bucket] || [];
    }

    function getUntitledCandidateTemplates(log){
      const logs = loadLogs().filter(l => l.text && l.text !== "無題");

      const targetStart = log && log.start ? timeToMinutes(log.start) : null;
      const targetBucket = targetStart !== null ? getTimeBucketFromMinutes(targetStart) : "afternoon";

      const frequency = {};
      const bucketFrequency = {};
      const recentNearTime = [];

      logs.forEach(l => {
        frequency[l.text] = (frequency[l.text] || 0) + 1;

        if(l.start){
          const startMin = timeToMinutes(l.start);
          const bucket = getTimeBucketFromMinutes(startMin);

          if(bucket === targetBucket){
            bucketFrequency[l.text] = (bucketFrequency[l.text] || 0) + 1;
          }

          if(targetStart !== null){
            const diff = Math.abs(startMin - targetStart);
            if(diff <= 180){
              recentNearTime.push(l);
            }
          }
        }
      });

      const manualFrequent = loadFrequentPlans ? loadFrequentPlans() : [];
      const defaults = ["MOS資格勉強","英語勉強","通学","友達と会話","YouTube","読書","食事","筋トレ","休憩","移動"];
      const timeDefaults = getTimeBucketDefaults(targetBucket);

      const scored = {};

      function addScore(text, score){
        if(!text || text === "無題") return;
        scored[text] = (scored[text] || 0) + score;
      }

      Object.entries(frequency).forEach(([text,count]) => addScore(text, count * 2));
      Object.entries(bucketFrequency).forEach(([text,count]) => addScore(text, count * 5));

      recentNearTime
        .sort((a,b)=>(b.id||0)-(a.id||0))
        .slice(0,12)
        .forEach((l,idx) => addScore(l.text, 10 - Math.min(idx,8)));

      manualFrequent.forEach((text,idx) => addScore(text, 4 - Math.min(idx,3) * 0.3));
      timeDefaults.forEach((text,idx) => addScore(text, 7 - idx * 0.5));
      defaults.forEach((text,idx) => addScore(text, 1 - Math.min(idx,5) * 0.05));

      const smart = Object.entries(scored)
        .sort((a,b)=>b[1]-a[1])
        .map(([text,score]) => ({text,score}))
        .slice(0,8);

      const frequentByUse = Object.entries(frequency)
        .sort((a,b)=>b[1]-a[1])
        .map(([text]) => text);

      return {
        bucket: targetBucket,
        bucketLabel: getTimeBucketLabel(targetBucket),
        smart,
        recent: [...new Set(recentNearTime.sort((a,b)=>(b.id||0)-(a.id||0)).map(l => l.text))].slice(0,6),
        frequent: [...new Set([...manualFrequent, ...frequentByUse, ...defaults])].slice(0,12)
      };
    }

    // 24時間リング用：極座標→直交座標変換（0度=12時方向、時計回り）
    function polarToCartesian(cx, cy, r, angleDeg){
      const angleRad = (angleDeg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) };
    }
    // ドーナツ型円弧のSVGパスを生成
    function describeDonutArc(cx, cy, rOuter, rInner, startAngle, endAngle){
      // 終了角が360度ぴったりだとSVGが描けないので、わずかに引く
      if(endAngle >= 360) endAngle = 359.99;
      if(endAngle - startAngle < 0.05) return "";
      const startOuter = polarToCartesian(cx, cy, rOuter, startAngle);
      const endOuter = polarToCartesian(cx, cy, rOuter, endAngle);
      const startInner = polarToCartesian(cx, cy, rInner, endAngle);
      const endInner = polarToCartesian(cx, cy, rInner, startAngle);
      const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
      return [
        "M", startOuter.x, startOuter.y,
        "A", rOuter, rOuter, 0, largeArc, 1, endOuter.x, endOuter.y,
        "L", startInner.x, startInner.y,
        "A", rInner, rInner, 0, largeArc, 0, endInner.x, endInner.y,
        "Z"
      ].join(" ");
    }

    function buildClockChart(valid){
      const colors=Array(1440).fill("#e0e0e0");
      valid.forEach(l=>{ for(let i=Math.max(0,l.startMin); i<Math.min(1440,l.endMin); i++) colors[i]=l.color; });
      let segs=[], cur=colors[0], start=0;
      for(let i=1;i<=1440;i++){ if(i===1440||colors[i]!==cur){ segs.push(`${cur} ${start/1440*360}deg ${i/1440*360}deg`); cur=colors[i]; start=i; } }
      const isMobile = window.innerWidth <= 850;
      const wrapperSize = isMobile ? 280 : 320;
      const ringSize = isMobile ? 210 : 240;
      const ringInset = isMobile ? 47 : 54;
      const center = wrapperSize / 2;
      const labelRadius = ringSize / 2 + 14;
      const rOuter = ringSize / 2;
      const rInner = rOuter - ringInset;
      const labels=Array.from({length:24},(_,h)=>{
        const a=h/24*2*Math.PI-Math.PI/2;
        const x=center+Math.cos(a)*labelRadius;
        const y=center+Math.sin(a)*labelRadius;
        return `<div class="clock-hour-label" style="left:${x}px; top:${y}px;">${h}</div>`;
      }).join("");
      // 各ログ用のクリック可能な透明SVG path
      const clickPaths = valid.map(log => {
        const startAngle = (log.startMin / 1440) * 360;
        const endAngle = (log.endMin / 1440) * 360;
        const d = describeDonutArc(center, center, rOuter, rInner, startAngle, endAngle);
        if(!d) return "";
        return `<path d="${d}" fill="rgba(0,0,0,0)" class="clock-click-segment" onclick="showLogMenu(${log.id})" data-log-id="${log.id}"></path>`;
      }).join("");
      return `<div class="clock-wrap"><h2>24時間リング表示</h2><div class="clock-ring-area"><div class="clock-wrapper">${labels}<div class="clock-ring" style="background:conic-gradient(${segs.join(",")});"></div><svg class="clock-overlay" width="${wrapperSize}" height="${wrapperSize}" viewBox="0 0 ${wrapperSize} ${wrapperSize}">${clickPaths}</svg></div></div><p class="small">灰色は未記録時間。色付き部分をタップすると、その記録を編集できます。</p></div>`;
    }
    function buildGapPrompts(logs,date){ const arr=logs.map(logWithMinutes).filter(l=>l.duration>0).sort((a,b)=>a.startMin-b.startMin); const gaps=[]; for(let i=0;i<arr.length-1;i++){ const gap=arr[i+1].startMin-arr[i].endMin; if(gap>0&&gap<=60) gaps.push({start:arr[i].end,end:arr[i+1].start,min:gap}); } if(!gaps.length) return ""; return `<div class="gap-wrap"><h2>ここ何してた？</h2><p class="small">1時間以下の未記録時間です。</p>${gaps.map(g=>`<div class="gap-card"><div class="log-title">${g.min}分の空白</div><div class="log-meta">${g.start}〜${g.end}</div><button class="blue" onclick="showGapFillForm('${date}','${g.start}','${g.end}')">この時間を埋める</button></div>`).join("")}</div>`; }

    function calculateFillRate(date){
      const logs=getDayLogs(date).map(logWithMinutes).filter(l=>l.duration>0);
      const total=logs.reduce((sum,l)=>sum+l.duration,0);
      const rate=Math.min(100,(total/1440)*100);
      return { totalMinutes: total, rate };
    }

    // ============================================================
    // 音声入力（Web Speech API） - 振り返りノート / 詳細メモへの追記
    // ============================================================
    let _voiceRecognition = null;
    let _voiceTargetId = null;
    let _voiceBaseText = "";
    function toggleVoiceInput(targetId, btnSuffix){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){
        alert("お使いのブラウザは音声入力に対応していません。\niPhoneの場合、Safari 14.5以降が必要です。");
        return;
      }
      // 既に同じターゲットで起動中なら停止
      if(_voiceRecognition && _voiceTargetId === targetId){
        try { _voiceRecognition.stop(); } catch(e){}
        return;
      }
      // 他で起動中なら停止
      if(_voiceRecognition){
        try { _voiceRecognition.stop(); } catch(e){}
        _voiceRecognition = null;
      }
      const target = document.getElementById(targetId);
      if(!target) return;
      _voiceTargetId = targetId;
      _voiceBaseText = target.value || "";
      _voiceRecognition = new SR();
      _voiceRecognition.lang = "ja-JP";
      _voiceRecognition.continuous = true;
      _voiceRecognition.interimResults = true;
      _voiceRecognition.onresult = (e) => {
        let interim = "", finalAdd = "";
        for(let i=e.resultIndex; i<e.results.length; i++){
          const t = e.results[i][0].transcript;
          if(e.results[i].isFinal) finalAdd += t;
          else interim += t;
        }
        if(finalAdd){
          _voiceBaseText = (_voiceBaseText ? _voiceBaseText + (_voiceBaseText.endsWith("\n") ? "" : " ") : "") + finalAdd;
          target.value = _voiceBaseText;
        } else {
          target.value = _voiceBaseText + (_voiceBaseText && interim ? " " : "") + interim;
        }
        // 既存のoninputハンドラに変更通知
        target.dispatchEvent(new Event("input", { bubbles: true }));
      };
      _voiceRecognition.onerror = (e) => {
        console.warn("Speech recognition error:", e.error);
        if(e.error === "not-allowed" || e.error === "service-not-allowed"){
          showSaveToast("マイクの利用が許可されていません", 2400);
        }
      };
      _voiceRecognition.onend = () => {
        updateMicButtons(false);
        _voiceRecognition = null;
        _voiceTargetId = null;
      };
      try {
        _voiceRecognition.start();
        updateMicButtons(true);
        showSaveToast("録音中…マイクボタンで停止", 1500);
      } catch(e){
        console.error("voice start failed:", e);
        _voiceRecognition = null;
        _voiceTargetId = null;
      }
    }
    function updateMicButtons(active){
      document.querySelectorAll(".mic-btn").forEach(btn => {
        if(active && _voiceTargetId){
          // 現在録音中のターゲットに対応するボタンだけアクティブ表示
          const onclick = btn.getAttribute("onclick") || "";
          btn.classList.toggle("mic-active", onclick.includes(`'${_voiceTargetId}'`));
        } else {
          btn.classList.remove("mic-active");
        }
      });
    }

    let _reviewSwipeAttached = false;
    function attachReviewSwipe(){
      const target = document.getElementById("reviewScreen");
      if(!target || _reviewSwipeAttached) return;
      _reviewSwipeAttached = true;
      let sx=null, sy=null, st=0;
      target.addEventListener("touchstart",(e)=>{
        if(e.touches.length!==1){ sx=null; return; }
        // textarea/inputへのタッチではスワイプを開始しない
        const tag = (e.target && e.target.tagName) || "";
        if(["TEXTAREA","INPUT","SELECT","BUTTON"].includes(tag)){ sx=null; return; }
        const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
      },{passive:true});
      target.addEventListener("touchend",(e)=>{
        if(sx===null) return;
        const t=e.changedTouches[0];
        const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
        sx=null;
        // 横スワイプ閾値：60px、横移動が縦の1.8倍以上、1秒以内
        if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.8 && dt<1000){
          const direction = dx<0 ? 1 : -1; // 左スワイプ→翌日(direction=1)、右スワイプ→前日
          animateReviewSlide(direction);
        }
      },{passive:true});
    }
    function animateReviewSlide(direction){
      if(!selectedDate) return;
      const target = document.getElementById("reviewScreen");
      if(!target || target.style.display === "none") return;
      const d = new Date(selectedDate + "T00:00:00");
      d.setDate(d.getDate() + direction);
      const newDate = toDateString(d);
      // 現在の画面をフェードアウト＋スライド
      target.classList.add(direction>0 ? "review-slide-left" : "review-slide-right");
      setTimeout(() => {
        // 新しい日付でshowReview呼出（中身書き換え）
        selectedDate = newDate;
        currentCalendarDate = new Date(newDate + "T00:00:00");
        // 一時的にスライドイン位置にセット
        target.classList.remove("review-slide-left","review-slide-right");
        target.classList.add(direction>0 ? "review-slide-in-from-right" : "review-slide-in-from-left");
        showReview(newDate);
        // 1フレーム待ってからスライドイン
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            target.classList.remove("review-slide-in-from-right","review-slide-in-from-left");
          });
        });
      }, 240);
    }

    function finalizeDailyFulfillment(date){
      const targetDate = date || selectedDate || todayString();
      const isToday = targetDate === todayString();
      const dateLabel = isToday ? "本日" : formatDateJapanese(targetDate);

      const scored = loadLogs().filter(l =>
        l.date === targetDate && typeof l.fulfillmentScore === "number"
      );

      if(!scored.length){
        alert("まだ充実ポイントが入力されていません");
        return;
      }

      let weightedSum = 0;
      let totalWeight = 0;

      scored.forEach(log => {
        const duration = Math.max(1, timeToMinutes(log.end) - timeToMinutes(log.start));
        const weight = Math.sqrt(duration);
        weightedSum += log.fulfillmentScore * weight;
        totalWeight += weight;
      });

      const weightedAverage = weightedSum / totalWeight;
      const fill = calculateFillRate(targetDate);
      const fillScore = fill.rate / 10;
      const totalFulfillment = weightedAverage * 0.8 + fillScore * 0.2;

      const existing = loadDailySummaries().find(s => s.date === targetDate);
      const summaries = loadDailySummaries().filter(s => s.date !== targetDate);
      summaries.push({
        ...(existing || {}),
        date: targetDate,
        totalFulfillment,
        weightedAverage,
        fillRate: fill.rate,
        loggedMinutes: fill.totalMinutes,
        updatedAt: new Date().toISOString()
      });
      summaries.sort((a,b)=>a.date.localeCompare(b.date));
      saveDailySummaries(summaries);

      const r = document.getElementById("reviewScreen");
      r.innerHTML = `
        <h2>${dateLabel}の充実度</h2>

        <div class="score-result">
          <div>${dateLabel}の総合充実度</div>

        </div>

          <strong>内訳</strong><br>
          <span class="small">
            時間補正済み充実ポイント：${weightedAverage.toFixed(1)} / 10<br>

        <div class="notice">

          <span class="small">
            充実ポイントは、各行動の点数を行動時間の平方根で重みづけしています。<br>
            そのため、長い行動ほど影響は大きくなりますが、「長いだけ」で評価が暴れにくい設計です。<br>
            総合充実度は、時間補正済み充実ポイントを80%、記録充填率スコアを20%として計算しています。
          </span>
        </div>

        <div class="actions">
          <button class="blue" onclick="showHighlightSelection('${targetDate}')">人生ハイライトを選ぶ</button>
          <button class="light" onclick="showDailyFulfillment('${targetDate}')">点数を修正する</button>

          <button class="light" onclick="showMenu()">戻る</button>
        </div>
      `;
    }

 class="light" onclick="showReview('${log.date}')">この日を見る</button></div></div>`; }); if(target&&!results.length) html+=`<div class="empty">${escapeHtml(target)} が付いた詳細メモはまだありません。</div>`; html+=`<div class="actions"><button class="light" onclick="showMenu()">戻る</button></div>`; r.innerHTML=html; }

        html += `<button class="theme-card${isActive?" theme-active":""}" onclick="applyThemeAndRefresh('${t.id}')">
          <span class="theme-swatch" style="background:${t.swatch};"></span>
          <span class="theme-name">${escapeHtml(t.name)}</span>
          ${isActive?'<span class="theme-check">✓</span>':''}
        </button>`;
      });
      html += `</div><div class="actions"><button class="light" onclick="showMenu()">戻る</button></div>`;
      r.innerHTML = html;
    }
    function applyThemeAndRefresh(themeId){
      applyTheme(themeId);
      showSaveToast("テーマを変更しました");
      showThemeSettings();
    }

    // ============================================================
    // 週次振り返り画面
    // ============================================================
    // 週次振り返り画面 + 今週の意図機能
    // ============================================================
    let _weeklyOffsetWeeks = 0; // 0=今週、-1=先週、+1=来週
    let _monthlyOffsetMonths = 0; // 0=今月、-1=先月、+1=来月
    let _fromTodayTab = false; // 振り返りタブ経由かどうか
    let _todayScope = "day"; // "day" / "week" / "month"

    function buildScopeSwitcher(active){
      return `<div class="scope-switcher">
        <button class="scope-btn ${active==="day"?"active":""}" onclick="setTodayScope('day')">日次</button>
        <button class="scope-btn ${active==="week"?"active":""}" onclick="setTodayScope('week')">週次</button>
        <button class="scope-btn ${active==="month"?"active":""}" onclick="setTodayScope('month')">月次</button>
      </div>`;
    }
    function setTodayScope(scope){
      _todayScope = scope;
      _fromTodayTab = true;
      // 切替時は offset をリセット
      if(scope === "week") _weeklyOffsetWeeks = 0;
      if(scope === "month") _monthlyOffsetMonths = 0;
      if(scope === "day"){
        const today = todayString();
        selectedDate = today;
        currentCalendarDate = new Date(today + "T00:00:00");
        showReview(today);
      } else if(scope === "week"){
        showWeeklyReview();
      } else if(scope === "month"){
        showMonthlyReview();
      }
    }

    // 月曜起点の週の月曜日を返す
    function getMondayOfWeek(date){
      const d = new Date(date);
      const dow = d.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      d.setDate(d.getDate() + diff);
      d.setHours(0,0,0,0);
      return d;
    }

    // 意図テキストから自動でキーワードを抽出（句読点・空白で分割、2文字以上）
    function extractAutoKeywords(text){
      if(!text) return [];
      return text.split(/[\s\n、。．，,\.！!\?？「」『』（）\(\)]+/)
                 .map(w => w.trim())
                 .filter(w => w.length >= 2);
    }
    // 意図に関連するログを抽出（部分一致、大文字小文字無視）
    function findIntentMatches(intent, logs){
      const userKeywords = Array.isArray(intent.keywords) ? intent.keywords.filter(k => k && String(k).length >= 1) : [];
      const autoKeywords = extractAutoKeywords(intent.text || "");
      const allKeywords = Array.from(new Set([...userKeywords, ...autoKeywords].map(k => String(k).toLowerCase())));
      if(!allKeywords.length) return { matches: [], byKeyword: {}, totalMinutes: 0 };
      const matchedIds = new Set();
      const byKeyword = {};
      logs.forEach(log => {
        const cat = getCategoryById(log.categoryId || "none");
        const blob = ((log.text||"") + " " + (log.detail||"") + " " + (cat.name||"")).toLowerCase();
        allKeywords.forEach(kw => {
          if(blob.includes(kw)){
            matchedIds.add(log.id);
            if(!byKeyword[kw]) byKeyword[kw] = { count:0, minutes:0, logIds:[] };
            if(!byKeyword[kw].logIds.includes(log.id)){
              byKeyword[kw].logIds.push(log.id);
              byKeyword[kw].count += 1;
              const [sh,sm]=(log.start||"0:0").split(":").map(Number);
              const [eh,em]=(log.end||"0:0").split(":").map(Number);
              const dur = (eh*60+em) - (sh*60+sm);
              if(dur > 0) byKeyword[kw].minutes += dur;
            }
          }
        });
      });
      const matches = logs.filter(l => matchedIds.has(l.id));
      const totalMinutes = matches.reduce((acc, log) => {
        const [sh,sm]=(log.start||"0:0").split(":").map(Number);
        const [eh,em]=(log.end||"0:0").split(":").map(Number);
        const dur = (eh*60+em) - (sh*60+sm);
        return acc + (dur > 0 ? dur : 0);
      }, 0);
      return { matches, byKeyword, totalMinutes };
    }

    function formatMinutesAsHM(min){
      if(!min) return "0分";
      const h = Math.floor(min/60), m = min%60;
      if(h && m) return `${h}時間${m}分`;
      if(h) return `${h}時間`;
      return `${m}分`;
    }

    function showWeeklyReview(offsetChange=null){
      hideRightPanels(); closeQuickMenu();
      if(offsetChange !== null) _weeklyOffsetWeeks += offsetChange;
      // 月曜起点
      const today = new Date();
      const baseMonday = getMondayOfWeek(today);
      const weekStart = new Date(baseMonday);
      weekStart.setDate(baseMonday.getDate() + _weeklyOffsetWeeks * 7);
      weekStart.setHours(0,0,0,0);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      const weekDates = [];
      for(let i=0; i<7; i++){
        const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
        weekDates.push(toDateString(d));
      }
      const weekStartDateStr = toDateString(weekStart);
      const isCurrentWeek = (_weeklyOffsetWeeks === 0);
      const isFuture = (_weeklyOffsetWeeks > 0);
      const logs = loadLogs().filter(l => weekDates.includes(l.date));
      const summaries = loadDailySummaries().filter(s => weekDates.includes(s.date));

      // 集計
      const periodLabel = `${weekStart.getFullYear()}/${weekStart.getMonth()+1}/${weekStart.getDate()} 〜 ${weekEnd.getMonth()+1}/${weekEnd.getDate()}`;
      const planCount = logs.filter(l => l.type==="plan" && !l.repeat).length;
      const actualCount = logs.filter(l => l.type==="actual").length;
      const allScores = [];
      summaries.forEach(s => (s.scores||[]).forEach(sc => { if(sc.score != null) allScores.push(sc); }));
      const avgScore = allScores.length ? (allScores.reduce((a,b)=>a+(b.score||0),0)/allScores.length).toFixed(1) : null;
      const top3 = [...allScores].sort((a,b)=>b.score-a.score).slice(0,3);
      const tagCounts = {};
      logs.forEach(l => {
        const tags = (l.detail||"").match(/#[\p{L}\p{N}_]+/gu) || [];
        tags.forEach(t => tagCounts[t] = (tagCounts[t]||0)+1);
      });
      const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const catMinutes = {};
      logs.filter(l => l.type==="actual").forEach(l => {
        const [sh,sm]=(l.start||"0:0").split(":").map(Number);
        const [eh,em]=(l.end||"0:0").split(":").map(Number);
        const dur = (eh*60+em)-(sh*60+sm);
        if(dur>0){ const cid = l.categoryId||"none"; catMinutes[cid] = (catMinutes[cid]||0) + dur; }
      });
      const catEntries = Object.entries(catMinutes).sort((a,b)=>b[1]-a[1]);
      const totalMin = catEntries.reduce((a,b)=>a+b[1],0);

      const r = document.getElementById("reviewScreen"); r.style.display = "block";
      const headerNav = `<div class="weekly-nav">
        <button class="mini-button" onclick="showWeeklyReview(-1)">‹ 前週</button>
        <span class="weekly-period">${periodLabel}</span>
        <button class="mini-button" onclick="showWeeklyReview(1)" ${isFuture?'disabled':''}>翌週 ›</button>
      </div>`;

      // ===== 「この週の意図」セクション =====
      const intent = getWeeklyIntent(weekStartDateStr);
      let intentSection = "";
      if(isCurrentWeek){
        // 今週：入力フォーム
        const currentText = intent ? intent.text : "";
        const currentKeywords = intent && intent.keywords ? intent.keywords.join(" ") : "";
        intentSection = `
          <h3 class="menu-section-title">この週の意図</h3>
          <p class="small">今週、自分が大事にしたいことを書きます。数値目標ではなく、質的な向き合い方として。達成・未達成の判定は出ません。</p>
          <label>意図（自由記述、複数行可）</label>
          <textarea id="weeklyIntentText" placeholder="例：本を読む時間を取り戻したい&#10;家族と話す機会を増やしたい&#10;体を動かしてみる">${escapeHtml(currentText)}</textarea>
          <label>関連キーワード（任意・空白区切り）</label>
          <input id="weeklyIntentKeywords" type="text" placeholder="例：読書 本 家族 運動" value="${escapeHtml(currentKeywords)}">
          <p class="small" style="margin-top:4px;color:#999;font-size:11px;">来週この画面を開くと、これらのキーワードに該当した先週のログが集計されます。</p>
          <div class="actions"><button class="blue" onclick="saveCurrentWeekIntent('${weekStartDateStr}')">意図を保存</button></div>
        `;
        // 既に意図がある場合、今週のログとのマッチも併せて表示（リアルタイム参照）
        if(intent && (intent.text || (intent.keywords||[]).length)){
          const matches = findIntentMatches(intent, logs);
          if(matches.matches.length){
            intentSection += `<div class="intent-match-summary"><strong>今週ここまでの該当ログ：</strong>${matches.matches.length}件 / 合計 ${formatMinutesAsHM(matches.totalMinutes)}</div>`;
          }
        }
      } else if(intent && (intent.text || (intent.keywords||[]).length)) {
        // 過去の週：書いた意図と該当ログの対比表示
        const matches = findIntentMatches(intent, logs);
        intentSection = `
          <h3 class="menu-section-title">この週の意図と事実</h3>
          <div class="intent-card">
            <div class="intent-card-label">あなたが書いていたこと</div>
            <div class="intent-card-text">${escapeHtml(intent.text || "(意図テキストなし)").replace(/\n/g,"<br>")}</div>
            ${(intent.keywords||[]).length ? `<div class="intent-keywords-row">${intent.keywords.map(k=>`<span class="intent-kw-chip">${escapeHtml(k)}</span>`).join("")}</div>` : ""}
          </div>
        `;
        if(matches.matches.length){
          intentSection += `
            <div class="intent-fact-card">
              <div class="intent-fact-label">この週の事実</div>
              <div class="intent-fact-total">該当ログ：<strong>${matches.matches.length}件</strong> / 合計 <strong>${formatMinutesAsHM(matches.totalMinutes)}</strong></div>
              <div class="intent-fact-keywords">`;
          Object.entries(matches.byKeyword).sort((a,b)=>b[1].minutes-a[1].minutes).forEach(([kw, info]) => {
            intentSection += `<div class="intent-kw-row"><span class="intent-kw-chip">${escapeHtml(kw)}</span><span class="intent-kw-meta">${info.count}件・${formatMinutesAsHM(info.minutes)}</span></div>`;
          });
          intentSection += `</div></div>`;
          // 該当ログのプレビュー（最大5件）
          intentSection += `<details class="intent-logs-expand"><summary>該当ログを見る（${matches.matches.length}件）</summary>`;
          matches.matches.slice(0, 30).forEach(log => {
            const cat = getCategoryById(log.categoryId || "none");
            const label = log.type === "plan" ? "予定" : "行動";
            intentSection += `<div class="intent-log-item"><div class="intent-log-meta">${formatDateJapanese(log.date)} / ${log.start}〜${log.end} / ${label}</div><div class="intent-log-title">${escapeHtml(log.text)}</div><span class="category-pill"><span class="category-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}</span></div>`;
          });
          intentSection += `</details>`;
        } else {
          intentSection += `<div class="empty" style="margin-top:8px;">該当するログは見つかりませんでした。<br>キーワードを変えると当てはまる記録が見つかるかもしれません。</div>`;
        }
        intentSection += `<div class="actions" style="margin-top:8px;"><button class="light" onclick="editPastWeekIntent('${weekStartDateStr}')">意図を編集</button></div>`;
      } else if(!isCurrentWeek){
        intentSection = `
          <h3 class="menu-section-title">この週の意図</h3>
          <div class="empty">この週には意図が書かれていません。<br>後からでも追加できます。</div>
          <div class="actions"><button class="light" onclick="editPastWeekIntent('${weekStartDateStr}')">この週の意図を追加</button></div>
        `;
      }

      let html = (_fromTodayTab ? buildScopeSwitcher("week") : "") + `<h2>週次振り返り</h2>${headerNav}
        ${intentSection}
        <h3 class="menu-section-title">この週のサマリ</h3>
        <div class="weekly-summary-grid">
          <div class="weekly-stat"><div class="weekly-stat-label">予定</div><div class="weekly-stat-value">${planCount}<span>件</span></div></div>
          <div class="weekly-stat"><div class="weekly-stat-label">行動</div><div class="weekly-stat-value">${actualCount}<span>件</span></div></div>
          <div class="weekly-stat"><div class="weekly-stat-label">平均充実度</div><div class="weekly-stat-value">${avgScore !== null ? avgScore : '—'}<span>${avgScore !== null ? '/10' : ''}</span></div></div>
        </div>`;

      if(catEntries.length){
        html += `<h3 class="menu-section-title">カテゴリ別の時間配分（行動）</h3>${buildCategoryPie(catEntries, totalMin)}`;
      }
      if(top3.length){
        html += `<h3 class="menu-section-title">充実度が高かった行動 TOP3</h3>`;
        top3.forEach((sc, i) => {
          const log = loadLogs().find(l => l.id === sc.logId);
          if(!log) return;
          const cat = getCategoryById(log.categoryId||"none");
          html += `<div class="weekly-top-item">
            <div class="weekly-top-rank">${i+1}</div>
            <div class="weekly-top-body">
              <div class="weekly-top-title">${escapeHtml(log.text)}</div>
              <div class="weekly-top-meta">${formatDateJapanese(log.date)} / ${log.start}〜${log.end} <span class="category-pill"><span class="category-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}</span></div>
            </div>
            <div class="weekly-top-score">${sc.score}</div>
          </div>`;
        });
      }
      if(topTags.length){
        html += `<h3 class="menu-section-title">よく使ったハッシュタグ</h3><div class="tag-cloud">${topTags.map(([t,c])=>`<button class="tag-chip" onclick="showReflectionNotebook('${t}')">${escapeHtml(t)} ${c}</button>`).join("")}</div>`;
      }
      if(!planCount && !actualCount && !avgScore && !topTags.length){
        html += `<div class="empty">この週はまだ記録がありません。</div>`;
      }

      html += `<div class="actions"><button class="light" onclick="showMenu()">戻る</button></div>`;
      r.innerHTML = html;
    }

    function saveCurrentWeekIntent(weekStartDate){
      const textEl = document.getElementById("weeklyIntentText");
      const kwEl = document.getElementById("weeklyIntentKeywords");
      const text = (textEl ? textEl.value : "").trim();
      const keywords = (kwEl ? kwEl.value : "").split(/[\s,、,]+/).map(s=>s.trim()).filter(s=>s.length>0);
      if(!text && !keywords.length){
        if(!confirm("意図とキーワードの両方が空欄ですが、保存しますか？")) return;
      }
      upsertWeeklyIntent(weekStartDate, text, keywords);
      showSaveToast("今週の意図を保存しました");
      showWeeklyReview();
    }
    function editPastWeekIntent(weekStartDate){
      const intent = getWeeklyIntent(weekStartDate) || { weekStartDate, text:"", keywords:[] };
      hideRightPanels();
      const f = document.getElementById("formScreen"); f.style.display = "block";
      const d = new Date(weekStartDate + "T00:00:00");
      const wkEnd = new Date(d); wkEnd.setDate(d.getDate()+6);

        <label>関連キーワード（空白区切り）</label>
        <input id="pastIntentKeywords" type="text" value="${escapeHtml((intent.keywords||[]).join(" "))}" placeholder="例：読書 本 家族">

    function savePastWeekIntent(weekStartDate){
      const text = (document.getElementById("pastIntentText").value || "").trim();

      upsertWeeklyIntent(weekStartDate, text, keywords);
      showSaveToast("意図を保存しました");
      showWeeklyReview();
