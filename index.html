    // ============================================================
    // 月次振り返り
    // ============================================================
    function showMonthlyReview(offsetChange=null){
      hideRightPanels(); closeQuickMenu();
      if(offsetChange !== null) _monthlyOffsetMonths += offsetChange;
      const today = new Date();
      const baseMonth = new Date(today.getFullYear(), today.getMonth() + _monthlyOffsetMonths, 1);
      const year = baseMonth.getFullYear(), month = baseMonth.getMonth();
      const monthStart = new Date(year, month, 1);
      const monthEnd = new Date(year, month + 1, 0); // 末日
      const daysInMonth = monthEnd.getDate();
      const monthDates = [];
      for(let d=1; d<=daysInMonth; d++){
        monthDates.push(toDateString(new Date(year, month, d)));
      }
      const isFuture = _monthlyOffsetMonths > 0;
      const logs = loadLogs().filter(l => monthDates.includes(l.date));
      const summaries = loadDailySummaries().filter(s => monthDates.includes(s.date));

      // 集計
      const periodLabel = `${year}年 ${month+1}月`;
      const planCount = logs.filter(l => l.type==="plan" && !l.repeat).length;
      const actualCount = logs.filter(l => l.type==="actual").length;
      const allScores = [];
      summaries.forEach(s => (s.scores||[]).forEach(sc => { if(sc.score != null) allScores.push(sc); }));
      const avgScore = allScores.length ? (allScores.reduce((a,b)=>a+(b.score||0),0)/allScores.length).toFixed(1) : null;
      const top5 = [...allScores].sort((a,b)=>b.score-a.score).slice(0,5);
      // ハッシュタグ
      const tagCounts = {};
      logs.forEach(l => {
        const tags = (l.detail||"").match(/#[\p{L}\p{N}_]+/gu) || [];
        tags.forEach(t => tagCounts[t] = (tagCounts[t]||0)+1);
      });
      const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
      // カテゴリ別時間配分
      const catMinutes = {};
      logs.filter(l => l.type==="actual").forEach(l => {
        const [sh,sm]=(l.start||"0:0").split(":").map(Number);
        const [eh,em]=(l.end||"0:0").split(":").map(Number);
        const dur = (eh*60+em)-(sh*60+sm);
        if(dur>0){ const cid = l.categoryId||"none"; catMinutes[cid] = (catMinutes[cid]||0) + dur; }
      });
      const catEntries = Object.entries(catMinutes).sort((a,b)=>b[1]-a[1]);
      const totalMin = catEntries.reduce((a,b)=>a+b[1],0);
      // 月内充実度推移（日別平均）
      const dailyAvg = monthDates.map(date => {
        const s = summaries.find(x => x.date === date);
        if(!s || !s.scores || !s.scores.length) return { date, avg:null, day:parseInt(date.split("-")[2],10) };
        const valid = s.scores.filter(sc => sc.score != null);
        if(!valid.length) return { date, avg:null, day:parseInt(date.split("-")[2],10) };
        return { date, avg: valid.reduce((a,b)=>a+b.score,0)/valid.length, day:parseInt(date.split("-")[2],10) };
      });
      // やめたこと（quitDateがこの月）
      const quitItems = loadQuitList().filter(q => {
        if(!q.quitDate) return false;
        const d = new Date(q.quitDate);
        return d.getFullYear() === year && d.getMonth() === month;
      });

      const r = document.getElementById("reviewScreen"); r.style.display = "block";
      const headerNav = `<div class="weekly-nav">
        <button class="mini-button" onclick="showMonthlyReview(-1)">‹ 前月</button>
        <span class="weekly-period">${periodLabel}</span>
        <button class="mini-button" onclick="showMonthlyReview(1)" ${isFuture?'disabled':''}>翌月 ›</button>
      </div>`;

      let html = (_fromTodayTab ? buildScopeSwitcher("month") : "") + `<h2>月次振り返り</h2>${headerNav}
        <div class="weekly-summary-grid">
          <div class="weekly-stat"><div class="weekly-stat-label">予定</div><div class="weekly-stat-value">${planCount}<span>件</span></div></div>
          <div class="weekly-stat"><div class="weekly-stat-label">行動</div><div class="weekly-stat-value">${actualCount}<span>件</span></div></div>
          <div class="weekly-stat"><div class="weekly-stat-label">平均充実度</div><div class="weekly-stat-value">${avgScore !== null ? avgScore : '—'}<span>${avgScore !== null ? '/10' : ''}</span></div></div>
        </div>`;

      // 月内充実度推移グラフ
      const hasAnyScore = dailyAvg.some(d => d.avg !== null);
      if(hasAnyScore){
        html += `<h3 class="menu-section-title">月内の充実度推移</h3>${buildMonthlyTrendChart(dailyAvg)}`;
      }

      if(catEntries.length){
        html += `<h3 class="menu-section-title">カテゴリ別の時間配分（行動）</h3>${buildCategoryPie(catEntries, totalMin)}`;
      }

      if(top5.length){
        html += `<h3 class="menu-section-title">充実度が高かった行動 TOP5</h3>`;
        top5.forEach((sc, i) => {
          const log = loadLogs().find(l => l.id === sc.logId);
          if(!log) return;
          const cat = getCategoryById(log.categoryId||"none");
          html += `<div class="weekly-top-item">
            <div class="weekly-top-rank">${i+1}</div>
            <div class="weekly-top-body">
              <div class="weekly-top-title">${escapeHtml(log.text)}</div>
              <div class="weekly-top-meta">${formatDateJapanese(log.date)} / ${log.start}〜${log.end} <span class="category-pill"><span class="category-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}</span></div>
            </div>
            <div class="weekly-top-score">${sc.score}</div>
          </div>`;
        });
      }

      if(topTags.length){
        html += `<h3 class="menu-section-title">よく使ったハッシュタグ</h3><div class="tag-cloud">${topTags.map(([t,c])=>`<button class="tag-chip" onclick="showReflectionNotebook('${t}')">${escapeHtml(t)} ${c}</button>`).join("")}</div>`;
      }

      if(quitItems.length){

    function buildMonthlyTrendChart(dailyAvg){
      const W = 320, H = 140, padL = 24, padR = 10, padT = 12, padB = 22;
      const innerW = W - padL - padR, innerH = H - padT - padB;
      const n = dailyAvg.length;
      // X座標：日付（1〜末日）を等間隔
      const xFor = (day) => padL + ((day - 1) / Math.max(n - 1, 1)) * innerW;
      // Y座標：0〜10
      const yFor = (score) => padT + (1 - score/10) * innerH;
      // 折れ線：avg が null でない日のみつなぐ
      const validPoints = dailyAvg.filter(d => d.avg !== null).map(d => ({ x: xFor(d.day), y: yFor(d.avg), d }));
      const poly = validPoints.map(p => `${p.x},${p.y}`).join(" ");
      const dots = validPoints.map(p => `<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="3"><title>${p.d.date}：${p.d.avg.toFixed(1)}</title></circle>`).join("");
      // Y軸ラベル（0, 5, 10）
      const yLabels = [0, 5, 10].map(v => `<text x="${padL-4}" y="${yFor(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v}</text>`).join("");
      const yGrid = [0, 5, 10].map(v => `<line x1="${padL}" x2="${W-padR}" y1="${yFor(v)}" y2="${yFor(v)}" stroke="var(--border)" stroke-dasharray="2,3"></line>`).join("");
      // X軸ラベル（1, 中, 末）
      const midDay = Math.ceil(n/2);
      const xLabels = [1, midDay, n].map(d => `<text x="${xFor(d)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${d}</text>`).join("");
      return `<svg viewBox="0 0 ${W} ${H}" class="monthly-trend-svg" aria-label="月内充実度推移">
        ${yGrid}${yLabels}${xLabels}
        ${validPoints.length>=2 ? `<polyline class="chart-line" points="${poly}" fill="none" stroke="var(--main)" stroke-width="2"></polyline>` : ""}
        ${dots}
      </svg>`;
    }

    // カテゴリ別円グラフ（SVGドーナツ）+ 凡例
    function buildCategoryPie(catEntries, totalMin){
      const cx=110, cy=110, rOuter=92, rInner=54;
      let svg = `<svg viewBox="0 0 220 220" class="category-pie-svg" aria-label="カテゴリ別円グラフ">`;
      let angle = 0;
      catEntries.forEach(([cid, mins]) => {
        const cat = getCategoryById(cid);
        const sweep = (mins/totalMin)*360;
        const path = describeDonutArc(cx, cy, rOuter, rInner, angle, angle+sweep);
        svg += `<path d="${path}" fill="${cat.color}" stroke="#fff" stroke-width="1.5"></path>`;
        angle += sweep;
      });
      svg += `<text x="110" y="105" text-anchor="middle" font-size="13" fill="var(--muted)" font-weight="600">合計</text>`;
      const totalH = Math.floor(totalMin/60), totalRest = totalMin%60;
      svg += `<text x="110" y="125" text-anchor="middle" font-size="17" fill="var(--text)" font-weight="800">${totalH}h${totalRest?` ${totalRest}m`:""}</text>`;
      svg += `</svg>`;
      // 凡例
      let legend = `<div class="category-pie-legend">`;
      catEntries.forEach(([cid, mins]) => {
        const cat = getCategoryById(cid);
        const pct = ((mins/totalMin)*100).toFixed(1);
        const h = Math.floor(mins/60), m = mins%60;
        legend += `<div class="legend-row">
          <span class="legend-dot" style="background:${cat.color};"></span>
          <span class="legend-name">${escapeHtml(cat.name)}</span>
          <span class="legend-bar"><span class="legend-bar-fill" style="width:${pct}%; background:${cat.color};"></span></span>
          <span class="legend-val">${h}h${m?`${m}m`:""}</span>
          <span class="legend-pct">${pct}%</span>
        </div>`;
      });
      legend += `</div>`;
      return `<div class="category-pie-wrap">${svg}${legend}</div>`;

    function detectDuplicateLogPairs(){
      const logs = loadLogs();
      const pairs = [];
      // 同じ日・同じtype・テキスト同一・開始時刻差±5分 を重複候補とする
      for(let i=0; i<logs.length; i++){
        for(let j=i+1; j<logs.length; j++){
          const a = logs[i], b = logs[j];
          if(a.date !== b.date) continue;
          if(a.type !== b.type) continue;
          if((a.text||"").trim() !== (b.text||"").trim()) continue;
          if((a.text||"").trim() === "") continue; // 無題は対象外
          // 開始時刻差を分単位で計算
          const [ah,am] = (a.start||"0:0").split(":").map(Number);
          const [bh,bm] = (b.start||"0:0").split(":").map(Number);
          const diff = Math.abs((ah*60+am) - (bh*60+bm));
          if(diff > 5) continue;
          pairs.push([a, b]);
        }
      }
      return pairs;
    }

      hideRightPanels(); closeQuickMenu();

      const r = document.getElementById("reviewScreen"); r.style.display = "block";

      } else {

        pairs.forEach((pair,i) => {
          const [a,b] = pair;
          const catA = getCategoryById(a.categoryId||"none"), catB = getCategoryById(b.categoryId||"none");
          const label = a.type === "plan" ? "予定" : "行動";
          html += `<div class="dup-pair" id="dupPair-${i}">

                <button class="blue mini-button" onclick="executeMergeLogs(${a.id},${b.id},'A',${i})">Aを残してマージ</button>
              </div>

                ${b.detail ? `<div class="dup-detail">${escapeHtml(b.detail).substring(0,80)}${b.detail.length>80?"…":""}</div>` : `<div class="dup-detail-empty">詳細メモなし</div>`}
                <button class="blue mini-button" onclick="executeMergeLogs(${a.id},${b.id},'B',${i})">Bを残してマージ</button>

            </div>
          </div>`;
        });
      }
      html += `<div class="actions"><button class="light" onclick="showMenu()">戻る</button></div>`;

    function executeMergeLogs(idA, idB, keep, pairIdx){
      const logs = loadLogs();
      const a = logs.find(l=>l.id===idA), b = logs.find(l=>l.id===idB);
      if(!a || !b) return;
      const keepLog = keep === "A" ? a : b;
      const removeLog = keep === "A" ? b : a;
      // 統合先に、相手の有用な情報を取り込む（detail空ならコピー、gcalEventIdあるなら継承）
      const merged = {
        ...keepLog,
        detail: keepLog.detail || removeLog.detail || "",
        gcalEventId: keepLog.gcalEventId || removeLog.gcalEventId || null,
        gcalSyncedAt: keepLog.gcalSyncedAt || removeLog.gcalSyncedAt || null,
        updatedAt: new Date().toISOString()
      };
      const newLogs = logs.filter(l => l.id !== removeLog.id).map(l => l.id === keepLog.id ? merged : l);
      saveLogs(newLogs);
      showSaveToast("ログをマージしました");
      // 該当ペアを画面から消す（再検出して再描画）
      showDuplicateChecker();
    }

    function buildFulfillmentLineChart(data){
      const width=680, height=280;
      const padL=42, padR=18, padT=18, padB=38;
      const innerW=width-padL-padR;
      const innerH=height-padT-padB;
      const n=data.length;
      const xFor=i=> n===1 ? padL+innerW/2 : padL+(i/(n-1))*innerW;
      const yFor=v=> padT+innerH-(v/10)*innerH;

      const points=data.map((d,i)=>({x:xFor(i), y:yFor(d.totalFulfillment), d}));
      const poly=points.map(p=>`${p.x},${p.y}`).join(" ");
      const grid=[0,2,4,6,8,10].map(v=>`<line class="chart-grid-line" x1="${padL}" y1="${yFor(v)}" x2="${width-padR}" y2="${yFor(v)}"></line><text class="chart-axis-text" x="8" y="${yFor(v)+4}">${v}</text>`).join("");
      const dots=points.map(p=>`<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="4"><title>${formatDateJapanese(p.d.date)}：${p.d.totalFulfillment.toFixed(1)}</title></circle>`).join("");

      const labelIndexes=[];
      if(n<=6){ for(let i=0;i<n;i++) labelIndexes.push(i); }
      else { labelIndexes.push(0, Math.floor((n-1)/4), Math.floor((n-1)/2), Math.floor((n-1)*3/4), n-1); }
      const xLabels=[...new Set(labelIndexes)].map(i=>{
        const d=data[i];
        const [,m,day]=d.date.split("-");
        return `<text class="chart-axis-text" x="${xFor(i)}" y="${height-12}" text-anchor="middle">${Number(m)}/${Number(day)}</text>`;
      }).join("");

      return `
        <div class="line-chart-wrap">
          <svg class="line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="充実度の折れ線グラフ">
            ${grid}
            <line class="chart-grid-line" x1="${padL}" y1="${padT}" x2="${padL}" y2="${height-padB}"></line>
            <line class="chart-grid-line" x1="${padL}" y1="${height-padB}" x2="${width-padR}" y2="${height-padB}"></line>
            <polyline class="chart-line" points="${poly}"></polyline>
            ${dots}
            ${xLabels}
          </svg>
        </div>
      `;
    }

    function renderMonthPage(refDate, pageEl){
      if(!pageEl) return;
      pageEl.innerHTML = "";
      const logs=loadLogs(), today=todayString();
      const y=refDate.getFullYear(), m=refDate.getMonth();
      const first=new Date(y,m,1), start=new Date(first); start.setDate(first.getDate()-first.getDay());
      for(let i=0;i<42;i++){
        const date=new Date(start); date.setDate(start.getDate()+i);
        const dateStr=toDateString(date), dayLogs=logs.filter(l=>l.date===dateStr);
        const dayPlans=dayLogs.filter(l=>l.type==="plan"&&!l.repeat).sort((a,b)=>a.start.localeCompare(b.start));
        const cell=document.createElement("div"); cell.className="day-cell";
        if(date.getMonth()!==m) cell.classList.add("outside");
        if(dateStr===today) cell.classList.add("today");
        if(dateStr===selectedDate) cell.classList.add("selected");
        const maxShow=4;
        const planChips=dayPlans.slice(0,maxShow).map(p=>{
          const cat=getCategoryById(p.categoryId||"none");
          return `<div class="day-plan-chip" style="background:${cat.color}22;color:${cat.color};border-left:2px solid ${cat.color};" title="${escapeHtml(p.text)}">${escapeHtml(p.text)}</div>`;
        }).join("");
        const more=dayPlans.length>maxShow?`<div class="day-plan-more">+${dayPlans.length-maxShow}</div>`:"";
        cell.innerHTML=`<div class="day-number">${date.getDate()}</div><div class="day-plans">${planChips}${more}</div>`;
        cell.onclick=()=>{
          if(Date.now() < _swipeSuppressClickUntil) return;
          const now = Date.now();
          if(_lastDayTapDate === dateStr && now - _lastDayTapTime < DOUBLE_TAP_THRESHOLD_MS){
            // ダブルタップ → 日次振り返りへ直接遷移
            _lastDayTapDate = null;
            _lastDayTapTime = 0;
            closeDateContextMenu();
            selectedDate = dateStr;
            _fromTodayTab = false; // カレンダー経由なのでスコープ切替UIは出さない
            showReview(dateStr);
            return;
          }
          _lastDayTapDate = dateStr;
          _lastDayTapTime = now;
          openDateContextMenu(dateStr, cell);
        };
        pageEl.appendChild(cell);
      }
    }

    // 指追従カルーセル（月間カレンダー）
    let _monthSwipeAttached=false;
    let _swipeSuppressClickUntil=0;
    // ダブルタップ検出用
    let _lastDayTapDate = null;
    let _lastDayTapTime = 0;
    const DOUBLE_TAP_THRESHOLD_MS = 400;
    function attachMonthSwipe(){
      if(_monthSwipeAttached) return;
      const viewport=document.getElementById("monthViewport");
      const slider=document.getElementById("monthSlider");
      if(!viewport || !slider) return;
      _monthSwipeAttached=true;
      let sx=null, sy=null, st=0;
      let isDragging=false, axisLocked=null, viewportW=0;

      viewport.addEventListener("touchstart",(e)=>{
        if(e.touches.length!==1){ sx=null; return; }
        const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
        isDragging=false; axisLocked=null;
        viewportW=viewport.offsetWidth || 1;
      },{passive:true});

      viewport.addEventListener("touchmove",(e)=>{
        if(sx===null) return;
        const t=e.touches[0];
        const dx=t.clientX-sx, dy=t.clientY-sy;
        // 軸方向の判定（5px超で確定）
        if(axisLocked===null){
          if(Math.abs(dx)>5 || Math.abs(dy)>5){
            axisLocked = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
          } else { return; }
        }
        if(axisLocked!=="h") return; // 縦方向ならスクロールに任せる
        // 指追従
        isDragging=true;
        slider.classList.add("dragging");
        const percent = -33.3333 + (dx / viewportW) * 33.3333;
        slider.style.transform = `translateX(${percent}%)`;
      },{passive:true});

      const endHandler = (e)=>{
        if(sx===null) return;
        const t=(e.changedTouches && e.changedTouches[0]) || null;
        const dx = t ? (t.clientX - sx) : 0;
        const dt = Date.now() - st;
        sx=null;
        if(!isDragging){ return; }
        slider.classList.remove("dragging"); // transition 復活
        const ratio = dx / viewportW;
        const velocity = Math.abs(dx) / Math.max(dt,1); // px/ms
        const goNext = ratio < -0.30 || (ratio < -0.05 && velocity > 0.45);
        const goPrev = ratio >  0.30 || (ratio >  0.05 && velocity > 0.45);
        _swipeSuppressClickUntil = Date.now() + 450;
        if(goNext){
          slider.style.transform = "translateX(-66.6666%)";
          setTimeout(()=>{
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
            renderCalendar();
          }, 290);
        } else if(goPrev){
          slider.style.transform = "translateX(0%)";
          setTimeout(()=>{
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
            renderCalendar();
          }, 290);
        } else {
          // スナップバック
          slider.style.transform = "translateX(-33.3333%)";
        }
      };
      viewport.addEventListener("touchend", endHandler, {passive:true});
      viewport.addEventListener("touchcancel", endHandler, {passive:true});
    }

    function renderWeekView(){
      // 表示切替（月間カルーセルを隠し、週間グリッドを出す）
      const monthArea = document.getElementById("monthCalendarArea");
      const grid=document.getElementById("calendarGrid");
      if(monthArea) monthArea.style.display = "none";
      if(grid) grid.style.display = "";
      const title=document.getElementById("calendarTitle");
      const logs=loadLogs();
      const today=todayString();
      const base=new Date(currentCalendarDate);
      const dow=base.getDay();
      const weekStart=new Date(base);
      weekStart.setDate(base.getDate()-dow);
      const weekEnd=new Date(weekStart);
      weekEnd.setDate(weekStart.getDate()+6);
      const sameMonth=weekStart.getMonth()===weekEnd.getMonth();
      const titleText=sameMonth
        ? `${weekStart.getFullYear()}年 ${weekStart.getMonth()+1}月${weekStart.getDate()}日〜${weekEnd.getDate()}日`
        : `${weekStart.getMonth()+1}/${weekStart.getDate()} 〜 ${weekEnd.getMonth()+1}/${weekEnd.getDate()}`;
      title.textContent=titleText;

      // 表示時間範囲：デフォルト6:00〜24:00、この週の予定があれば範囲拡張
      let startHour=6, endHour=24;
      const weekDates=[];
      for(let i=0;i<7;i++){
        const d=new Date(weekStart); d.setDate(weekStart.getDate()+i);
        weekDates.push(toDateString(d));
      }
      const weekLogs=logs.filter(l=>weekDates.includes(l.date));
      weekLogs.forEach(l=>{
        const sh=parseInt(l.start.split(":")[0]||"0");
        const em=l.end.split(":"); const eh=parseInt(em[0]||"0"); const emin=parseInt(em[1]||"0");
        if(sh < startHour) startHour=Math.max(0, sh);
        const endNeeded = emin>0 ? eh+1 : eh;
        if(endNeeded > endHour && endNeeded <= 24) endHour=endNeeded;
      });
      const hourCount=endHour-startHour;
      const hourHeight=56; // 1時間 = 56px
      const bodyHeight=hourCount*hourHeight;

      grid.className="week-grid";

      const weekdayNames=["日","月","火","水","木","金","土"];
      const weekdayClasses=["sun","","","","","","sat"];

      let html=`<p class="week-hint">空白タップで予定追加 / 予定ブロックタップで編集 / 日付ヘッダータップでその日の振り返り</p><div class="week-timegrid-scroll"><div class="week-timegrid">`;

      // ヘッダー（曜日と日付）
      html+=`<div class="week-timegrid-header"><div class="week-time-col-header"></div>`;
      for(let i=0;i<7;i++){
        const date=new Date(weekStart); date.setDate(weekStart.getDate()+i);
        const dateStr=toDateString(date);
        const isToday=dateStr===today;
        const isSelected=dateStr===selectedDate;
        html+=`<div class="week-day-col-header ${isToday?'today':''} ${isSelected?'selected':''}" onclick="onWeekDayClick('${dateStr}')">
          <span class="week-day-col-name ${weekdayClasses[i]}">${weekdayNames[i]}</span>
          <span class="week-day-col-num">${date.getDate()}</span>
        </div>`;
      }
      html+=`</div>`;

      // 本体
      html+=`<div class="week-timegrid-body" style="height:${bodyHeight}px;">`;

      // 時間軸ラベル列
      html+=`<div class="week-time-axis">`;
      for(let h=startHour;h<=endHour;h++){
        html+=`<div class="week-time-label" style="top:${(h-startHour)*hourHeight}px;">${String(h).padStart(2,"0")}:00</div>`;
      }
      html+=`</div>`;

      // 各日列
      for(let i=0;i<7;i++){
        const date=new Date(weekStart); date.setDate(weekStart.getDate()+i);
        const dateStr=toDateString(date);
        const isToday=dateStr===today;
        const dayLogs=logs.filter(l=>l.date===dateStr);

        html+=`<div class="week-day-col ${isToday?'today':''}" data-date="${dateStr}" data-start-hour="${startHour}" onclick="onWeekDayColClick(event, '${dateStr}')">`;

        // 水平の時間グリッド線（各時刻の上端）
        for(let h=startHour;h<=endHour;h++){
          html+=`<div class="week-hour-line" style="top:${(h-startHour)*hourHeight}px;"></div>`;
        }

        // 現在時刻ライン（今日のみ）
        if(isToday){
          const now=new Date();
          const nowMin=now.getHours()*60 + now.getMinutes();
          const nowTop=(nowMin - startHour*60) / 60 * hourHeight;
          if(nowTop >= 0 && nowTop <= bodyHeight){
            html+=`<div class="week-now-line" style="top:${nowTop}px;"></div>`;
          }
        }

        // 予定/実績ブロック
        dayLogs.forEach(l=>{
          const sm=timeToMinutes(l.start);
          const em=timeToMinutes(l.end);
          if(em<=sm) return;
          const top=(sm - startHour*60) / 60 * hourHeight;
          const height=Math.max(22, (em - sm) / 60 * hourHeight - 2);
          if(top + height < 0 || top > bodyHeight) return;
          const cat=getCategoryById(l.categoryId||"none");
          const typeMark=l.type==="plan"?"予":"行";
          html+=`<div class="week-event ${l.type}" style="top:${top}px; height:${height}px; background:${cat.color};" onclick="event.stopPropagation(); showLogMenu(${l.id})">
            <div class="week-event-time">${typeMark} ${l.start}〜${l.end}</div>
            <div class="week-event-text">${escapeHtml(l.text)}</div>
          </div>`;
        });

        html+=`</div>`;
      }

      html+=`</div></div></div>`;
      grid.innerHTML=html;

      // 初回表示時、現在時刻 or 8:00 付近にスクロール
      setTimeout(()=>{
        const scrollEl=grid.querySelector(".week-timegrid-scroll");
        if(!scrollEl) return;
        const now=new Date();
        let targetHour=8;
        if(weekDates.includes(today)){
          targetHour=Math.max(startHour, now.getHours()-1);
        }
        const scrollTop=Math.max(0, (targetHour - startHour) * hourHeight - 20);
        scrollEl.scrollTop=scrollTop;
      }, 30);
    }

    function onWeekDayColClick(event, dateStr){
      // 予定ブロックのクリックはstopPropagationで止めている → ここに来るのは空白タップのみ
      const col=event.currentTarget;
      const rect=col.getBoundingClientRect();
      const y=event.clientY - rect.top;
      const hourHeight=56; // CSSと一致
      const startHourOfView=parseInt(col.dataset.startHour||"6");
      const totalMin=y / hourHeight * 60 + startHourOfView * 60;
      // 15分単位に丸める
      const roundedMin=Math.max(0, Math.min(23*60+45, Math.floor(totalMin / 15) * 15));
      const startTime=minutesToTimeString(roundedMin);
      const endMin=Math.min(24*60-1, roundedMin + 60);
      const endTime=minutesToTimeString(endMin);
      // 選択日も同期しておく
      selectedDate=dateStr;
      currentCalendarDate=new Date(dateStr+"T00:00:00");
      showPlanForm(dateStr, startTime, endTime);
    }

    function minutesToTimeString(totalMin){
      const h=Math.floor(totalMin / 60) % 24;
      const m=totalMin % 60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    }

    // ============================================================
    // Googleカレンダー連携（OAuth方式、plan予定のみ送信、削除同期なし、プライマリ固定）
    // ============================================================
    let gcalTokenClient = null;
    let gcalAccessToken = null;
    let gcalTokenExpiry = 0;
    let gcalUserEmail = null;

    // getGcalClientIdはこのファイル後半でFIXED_GCAL_CLIENT_ID固定値を返す形に統一

    function loadGcalTokenFromStorage(){
      try {
        const raw = localStorage.getItem(GCAL_TOKEN_KEY);
        if(!raw) return;
        const obj = JSON.parse(raw);
        if(obj.expiry && obj.expiry > Date.now()){
          gcalAccessToken = obj.token;
          gcalTokenExpiry = obj.expiry;
          gcalUserEmail = localStorage.getItem(GCAL_USER_KEY) || null;
        }
      } catch(e){ console.error(e); }
    }
    function saveGcalToken(token, expiresIn){
      gcalAccessToken = token;
      gcalTokenExpiry = Date.now() + (Math.max(60, expiresIn) - 60) * 1000;
      localStorage.setItem(GCAL_TOKEN_KEY, JSON.stringify({ token, expiry: gcalTokenExpiry }));
    }
    function clearGcalToken(){
      gcalAccessToken = null;
      gcalTokenExpiry = 0;
      gcalUserEmail = null;
      localStorage.removeItem(GCAL_TOKEN_KEY);
      localStorage.removeItem(GCAL_USER_KEY);
    }
    function isGcalAuthenticated(){ return gcalAccessToken && gcalTokenExpiry > Date.now(); }

    function initGcalTokenClient(){
      const clientId = getGcalClientId();
      if(!clientId || !window.google || !google.accounts || !google.accounts.oauth2) return null;
      if(gcalTokenClient && gcalTokenClient._clientId === clientId) return gcalTokenClient;
      gcalTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata",
        callback: (response) => {
          if(response && response.access_token){
            saveGcalToken(response.access_token, response.expires_in || 3600);
            fetchGcalUserInfo();
            renderGcalSection();
            // 認証成功 → Drive同期開始
            if(typeof syncDriveStartup === "function") syncDriveStartup();
          } else if(response && response.error){
            alert("Googleカレンダー認証に失敗：" + response.error);
          }
        }
      });
      gcalTokenClient._clientId = clientId;
      return gcalTokenClient;
    }

    async function fetchGcalUserInfo(){
      if(!gcalAccessToken) return;
      try {
        const res = await fetch("https://www.googleapis.com/calendar/v3/users/me/calendarList/primary", {
          headers: { Authorization: "Bearer " + gcalAccessToken }
        });
        if(res.ok){
          const data = await res.json();
          gcalUserEmail = data.id || data.summary || "Googleユーザー";
          localStorage.setItem(GCAL_USER_KEY, gcalUserEmail);
          renderGcalSection();
        }
      } catch(e){ console.error(e); }
    }

    function loginGcal(){
      const client = initGcalTokenClient();
      if(!client){
        alert("クライアントIDが未設定、またはGoogleライブラリがまだ読み込まれていません。少し時間を置いて再度お試しください。");
        return;
      }
      client.requestAccessToken();
    }

      if(gcalAccessToken && window.google && google.accounts && google.accounts.oauth2){

    async function sendLogToGcal(log){
      if(!isGcalAuthenticated()){
        return { ok: false, reason: "未連携" };
      }
      if(log.type !== "plan"){
        return { ok: false, reason: "予定（plan）のみ送信可能" };
      }
      const startDateTime = `${log.date}T${log.start}:00`;
      const endDateTime = `${log.date}T${log.end}:00`;
      const eventBody = {
        summary: log.text || "(無題)",
        start: { dateTime: startDateTime, timeZone: "Asia/Tokyo" },
        end: { dateTime: endDateTime, timeZone: "Asia/Tokyo" },
        description: log.detail || ""
      };
      try {
        let res;
        if(log.gcalEventId){
          res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(log.gcalEventId)}`, {
            method: "PUT",
            headers: { Authorization: "Bearer " + gcalAccessToken, "Content-Type": "application/json" },
            body: JSON.stringify(eventBody)
          });
        } else {
          res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
            method: "POST",
            headers: { Authorization: "Bearer " + gcalAccessToken, "Content-Type": "application/json" },
            body: JSON.stringify(eventBody)
          });
        }
        if(res.ok){
          const data = await res.json();
          const logs = loadLogs().map(l => l.id === log.id ? { ...l, gcalEventId: data.id, gcalSyncedAt: new Date().toISOString() } : l);
          saveLogs(logs);
          return { ok: true, eventId: data.id };
        } else {
          const errText = await res.text();
          console.error("GCal送信失敗:", res.status, errText);
          if(res.status === 401){ clearGcalToken(); renderGcalSection(); }
          return { ok: false, reason: res.status === 401 ? "認証期限切れ。再ログインしてください" : `HTTPエラー ${res.status}` };
        }
      } catch(e){
        console.error(e);
        return { ok: false, reason: e.message };
      }
    }

    async function syncAllPlansToGcal(){
      if(!isGcalAuthenticated()){
        alert("先にGoogleカレンダーと連携してください");
        return;
      }
      const targets = loadLogs().filter(l => l.type === "plan" && !l.repeat);
      if(!targets.length){
        alert("送信する予定がありません");
        return;
      }
      if(!confirm(`${targets.length}件の予定をGoogleカレンダーに送信します。よろしいですか？\n（既送信済みは更新されます）`)) return;
      let success = 0, failed = 0;
      const failures = [];
      for(const log of targets){
        const r = await sendLogToGcal(log);
        if(r.ok){ success++; } else { failed++; failures.push(log.text + " : " + r.reason); }
      }
      let msg = `送信完了：${success}件成功、${failed}件失敗`;
      if(failures.length) msg += "\n\n失敗内訳:\n" + failures.slice(0, 5).join("\n");
      alert(msg);
      renderGcalSection();
    }

          </div>
          <div class="apply-divider"></div>
          <p class="small"><strong>初めての方へ</strong><br>このアプリは現在テスト運用中のため、ご利用には事前のテストユーザー登録が必要です。下記から申請してください。承認には数日かかる場合があります。</p>
          <div class="actions">
            ${applyDisabled
              ? `<button class="light" disabled style="opacity:.5;cursor:not-allowed;">登録申請（準備中）</button>`
              : `<a class="apply-link-btn" href="${TEST_USER_APPLY_URL}" target="_blank" rel="noopener">登録を申請する（Google Formsが開きます）</a>`
            }
          </div>
          ${applyDisabled ? `<p class="small" style="color:#bbb;font-size:11px;">※ アプリ管理者：申請URLを設定すると有効になります。</p>` : ""}
          <p class="small" style="margin-top:8px;color:#888;">承認済みの方はそのまま「Googleアカウントで連携」を押してください。承認前のアカウントで連携を試みると「Access blocked」エラーになります。</p>
        `;
      } else {
        const lastSync = _syncLastSuccessAt ? formatTimeAgo(_syncLastSuccessAt) : "未同期";
        html = `
          <div class="gcal-info-row">
            <strong>連携中：</strong>${escapeHtml(gcalUserEmail || "Googleアカウント")}<br>
            <strong>カレンダー同期：</strong>${syncedCount} / ${allPlans.length} 件の予定が送信済み<br>
            <strong>Driveバックアップ：</strong>${_syncStatus === "synced" ? "✓ " + lastSync : (_syncStatus === "syncing" ? "同期中…" : (_syncStatus === "error" ? "エラー" : "待機中"))}
          </div>
          <div class="actions">
            <button class="blue" onclick="syncAllPlansToGcal()">予定を一括同期</button>
            <button class="light" onclick="triggerDriveSync(true)">今すぐバックアップ</button>
            <button class="light" onclick="logoutGcal()">連携解除</button>
          </div>
          <p class="small" style="margin-top:8px;">予定はGoogleカレンダーへ自動送信、全データはGoogle Driveに自動バックアップされます。別端末で同じGoogleアカウントで連携すれば、同じデータが利用できます。</p>
        `;
      }
      el.innerHTML = html;
    }

    // Googleライブラリ読み込み完了を待ってトークンクライアント初期化
    loadGcalTokenFromStorage();
    function tryInitGcalAfterLoad(){
      if(window.google && google.accounts && google.accounts.oauth2){
        initGcalTokenClient();
        renderGcalSection();
        // 認証済みなら起動時sync
        if(isGcalAuthenticated()) syncDriveStartup();
      } else {
        setTimeout(tryInitGcalAfterLoad, 400);
      }
    }
    tryInitGcalAfterLoad();
    // ============================================================

    // ============================================================
    // Google Drive 自動同期（v56）
    // データを Drive の appDataFolder に lifelog-data.json として保存
    // ============================================================
    const SYNC_KEYS = [STORAGE_KEY, CATEGORY_KEY, TEMPLATE_KEY, TAG_KEY, SUMMARY_KEY, QUIT_KEY, WEEKLY_INTENT_KEY];
    const SYNC_FILE_NAME = "lifelog-data.json";
    let _driveFileId = null;
    let _syncStatus = "idle"; // idle, syncing, synced, error, not_connected
    let _syncLastSuccessAt = null;
    let _syncDebounceTimer = null;
    let _initialSyncDone = false;

    function setSyncStatus(status){
      _syncStatus = status;
      if(status === "synced") _syncLastSuccessAt = new Date();
      renderSyncBadge();
    }

    function formatTimeAgo(date){
      if(!date) return "";
      const diff = Math.floor((Date.now() - date.getTime()) / 1000);
      if(diff < 10) return "たった今";
      if(diff < 60) return `${diff}秒前`;
      if(diff < 3600) return `${Math.floor(diff/60)}分前`;
      if(diff < 86400) return `${Math.floor(diff/3600)}時間前`;
      return `${Math.floor(diff/86400)}日前`;
    }

    function renderSyncBadge(){
      const el = document.getElementById("syncBadge");
      if(!el) return;
      const map = {
        idle: { icon:"", text:"", cls:"" },
        not_connected: { icon:"", text:"", cls:"" },
        syncing: { icon:"⟳", text:"同期中…", cls:"sync-badge-busy" },
        synced: { icon:"☁", text:`同期済 ${formatTimeAgo(_syncLastSuccessAt)}`, cls:"sync-badge-ok" },
        error: { icon:"⚠", text:"同期エラー（再試行）", cls:"sync-badge-err" }
      };
      const m = map[_syncStatus] || map.idle;
      if(!m.text){ el.style.display = "none"; return; }
      el.style.display = "inline-flex";
      el.className = "sync-badge " + m.cls;
      el.innerHTML = `<span class="sync-icon">${m.icon}</span><span>${m.text}</span>`;
      el.onclick = (_syncStatus === "error") ? (()=>triggerDriveSync(true)) : null;
    }

    // 「同期済 N分前」の表示を定期更新
    setInterval(() => { if(_syncStatus === "synced") renderSyncBadge(); }, 30000);

    async function driveListSyncFile(){
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)`, {
        headers: { Authorization: "Bearer " + gcalAccessToken }
      });
      if(!res.ok) throw new Error("drive list "+res.status);
      const data = await res.json();
      return (data.files || []).find(f => f.name === SYNC_FILE_NAME) || null;
    }

    async function driveDownloadSyncFile(fileId){
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: "Bearer " + gcalAccessToken }
      });
      if(!res.ok) throw new Error("drive get "+res.status);
      return await res.json();
    }

    async function driveUploadSyncFile(fileId, content){
      if(fileId){
        const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
          method: "PATCH",
          headers: { Authorization: "Bearer " + gcalAccessToken, "Content-Type": "application/json" },
          body: JSON.stringify(content)
        });
        if(!res.ok) throw new Error("drive update "+res.status);
        return await res.json();
      } else {
        const metadata = { name: SYNC_FILE_NAME, parents: ["appDataFolder"] };
        const boundary = "boundary_lifelog_" + Date.now();
        const body =
          `--${boundary}\r\n` +
          `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
          JSON.stringify(metadata) + `\r\n` +
          `--${boundary}\r\n` +
          `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
          JSON.stringify(content) + `\r\n` +
          `--${boundary}--`;
        const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, {
          method: "POST",
          headers: { Authorization: "Bearer " + gcalAccessToken, "Content-Type": `multipart/related; boundary=${boundary}` },
          body
        });
        if(!res.ok) throw new Error("drive create "+res.status);
        return await res.json();
      }
    }

    function collectAllLocalData(){
      return {
        version: "v56",
        updatedAt: new Date().toISOString(),
        logs: loadLogs(),
        categories: loadCategories(),
        templates: loadFrequentPlans(),
        tags: loadFrequentTags(),
        summaries: loadDailySummaries(),
        quitList: loadQuitList(),
        weeklyIntents: loadWeeklyIntents()
      };
    }

    function applyAllLocalData(data){
      _suppressSyncTrigger = true;
      try {
        if(Array.isArray(data.logs)) saveLogs(data.logs);
        if(Array.isArray(data.categories)) saveCategories(data.categories);
        if(Array.isArray(data.templates)) saveFrequentPlans(data.templates);
        if(Array.isArray(data.tags)) saveFrequentTags(data.tags);
        if(Array.isArray(data.summaries)) saveDailySummaries(data.summaries);
        if(Array.isArray(data.quitList)) saveQuitList(data.quitList);
        if(Array.isArray(data.weeklyIntents)) saveWeeklyIntents(data.weeklyIntents);
      } finally {
        _suppressSyncTrigger = false;
      }
    }

    // ID単位、updatedAtで新しい方を採用してマージ
    function mergeArraysById(local, remote, keyField, tsField){
      const map = {};
      (remote || []).forEach(r => { if(r && r[keyField] != null) map[r[keyField]] = r; });
      (local || []).forEach(l => {
        if(!l || l[keyField] == null) return;
        const r = map[l[keyField]];
        if(!r){ map[l[keyField]] = l; return; }
        const lt = new Date(l[tsField] || l.updatedAt || 0).getTime();
        const rt = new Date(r[tsField] || r.updatedAt || 0).getTime();
        map[l[keyField]] = lt >= rt ? l : r;
      });
      return Object.values(map);
    }

    function mergeSummariesByDate(local, remote){
      const merged = {};
      (remote||[]).forEach(s => { if(s && s.date) merged[s.date] = s; });
      (local||[]).forEach(s => {
        if(!s || !s.date) return;
        const r = merged[s.date];
        if(!r){ merged[s.date] = s; return; }
        const lt = new Date(s.updatedAt || 0).getTime();
        const rt = new Date(r.updatedAt || 0).getTime();
        merged[s.date] = lt >= rt ? s : r;
      });
      return Object.values(merged);
    }

    function mergeAllData(local, remote){
      // weeklyIntentsはweekStartDateを一意キーとしてマージ
      const mergeWeeklyIntents = (a, b) => {
        const map = {};
        (b||[]).forEach(x => { if(x && x.weekStartDate) map[x.weekStartDate] = x; });
        (a||[]).forEach(x => {
          if(!x || !x.weekStartDate) return;
          const r = map[x.weekStartDate];
          if(!r){ map[x.weekStartDate] = x; return; }
          const lt = new Date(x.updatedAt || 0).getTime();
          const rt = new Date(r.updatedAt || 0).getTime();
          map[x.weekStartDate] = lt >= rt ? x : r;
        });
        return Object.values(map);
      };
      return {
        version: "v56",
        updatedAt: new Date().toISOString(),
        logs: mergeArraysById(local.logs, remote.logs, "id", "updatedAt"),
        categories: mergeArraysById(local.categories, remote.categories, "id", "updatedAt"),
        templates: Array.from(new Set([...(local.templates||[]), ...(remote.templates||[])])),
        tags: Array.from(new Set([...(local.tags||[]), ...(remote.tags||[])])),
        summaries: mergeSummariesByDate(local.summaries, remote.summaries),
        quitList: mergeArraysById(local.quitList, remote.quitList, "id", "updatedAt"),
        weeklyIntents: mergeWeeklyIntents(local.weeklyIntents, remote.weeklyIntents)
      };
    }

    async function syncDriveStartup(){
      if(!isGcalAuthenticated()){ setSyncStatus("not_connected"); return; }
      if(_initialSyncDone) return;
      setSyncStatus("syncing");
      try {
        const file = await driveListSyncFile();
        const local = collectAllLocalData();
        if(!file){
          // 初回：ローカルをアップロード
          const created = await driveUploadSyncFile(null, local);
          _driveFileId = created.id;
        } else {
          _driveFileId = file.id;
          const remote = await driveDownloadSyncFile(file.id);
          const merged = mergeAllData(local, remote);
          applyAllLocalData(merged);
          // マージ結果をアップロード
          await driveUploadSyncFile(file.id, merged);
          // 画面リフレッシュ
          try {
            const tab = document.body.dataset.activeTab || "calendar";
            if(tab === "calendar") renderCalendar();
            else if(tab === "today" && typeof updateTodayBar === "function") updateTodayBar();
            renderGcalSection();
          } catch(e){ console.warn("UI refresh after sync failed:", e); }
        }
        setSyncStatus("synced");
        _initialSyncDone = true;
      } catch(e){
        console.error("Drive startup sync failed:", e);
        if(String(e.message||"").includes("401")) { clearGcalToken(); renderGcalSection(); }
        setSyncStatus("error");
      }
    }

    // データ変更時のデバウンス同期
    function triggerDriveSync(immediate=false){
      if(!isGcalAuthenticated()){ setSyncStatus("not_connected"); return; }
      if(!_initialSyncDone && !immediate) return; // 起動同期が終わるまで自動同期は控える
      if(_syncDebounceTimer) clearTimeout(_syncDebounceTimer);
      const delay = immediate ? 0 : 3000;
      _syncDebounceTimer = setTimeout(async () => {
        setSyncStatus("syncing");
        try {
          const local = collectAllLocalData();
          if(!_driveFileId){
            const file = await driveListSyncFile();
            if(file) _driveFileId = file.id;
          }
          if(_driveFileId){
            await driveUploadSyncFile(_driveFileId, local);
          } else {
            const created = await driveUploadSyncFile(null, local);
            _driveFileId = created.id;
          }
          setSyncStatus("synced");
        } catch(e){
          console.error("Drive sync failed:", e);
          if(String(e.message||"").includes("401")) { clearGcalToken(); renderGcalSection(); }
          setSyncStatus("error");
        }
      }, delay);
    }

    // 連携解除時の後始末
    function resetDriveSyncState(){
      _driveFileId = null;
      _initialSyncDone = false;
      _syncLastSuccessAt = null;
      setSyncStatus("not_connected");
    }
    // ============================================================

    // モバイル時、formScreen/reviewScreenがblockになったら自動スクロール
    // 加えて、カレンダータブで表示された場合は右ペインを見える状態にする
    function initMobileScrollObserver(){
      const observer = new MutationObserver(mutations => {
        mutations.forEach(m => {
          if(m.attributeName === "style"){
            const el = m.target;
            if(el.style.display === "block" && (el.id === "formScreen" || el.id === "reviewScreen")){
              // カレンダータブで右ペインが隠れていたら見えるようにする
              if(currentTab === "calendar"){
                document.body.dataset.showReview = "true";
              }
              // モバイルでは右ペインまでスクロール
              if(window.innerWidth <= 850){
                scrollToRightPanelMobile();
              }
            }
          }
        });
      });
      ["formScreen","reviewScreen"].forEach(id => {
        const el = document.getElementById(id);
        if(el) observer.observe(el, { attributes: true, attributeFilter: ["style"] });
      });
    }

    // 初期状態：カレンダータブ + 保存テーマ適用
    applyTheme(getCurrentTheme());
    document.body.dataset.activeTab = "calendar";
    document.body.dataset.showReview = "false";
    document.getElementById("menuScreen").style.display = "none";

    updateTodayBar();
    renderCalendar();
    updateLiveStopwatchBar();
    setInterval(updateLiveStopwatchBar,1000);
    initMobileScrollObserver();

    // ============================================================
    // Service Worker 登録（PWA化、オフライン対応）
    // ※ Claude/その他アプリ内のWebViewでは登録失敗するが実害なし（ログ抑制）
    // ============================================================
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .then((reg) => console.log("[SW] registered:", reg.scope))
          .catch((err) => {
            const msg = String(err && err.message || err);
            // app-bound domain は WebView内プレビューで出る既知の制限、ログ不要
            if (msg.includes("app-bound domain") || msg.includes("not allowed")) return;
            console.warn("[SW] register failed:", err);
          });
      });
    }

    // ============================================================
    // 未入力ハイライト：今日タブにバッジ表示
    // 今日の actual ログのうち、充実度スコアが未入力のものがあれば
    // 「今日」タブに赤い●を出して気付かせる
    // ============================================================
    function countUnscoredTodayActuals(){
      const today = todayString();
      const todayActuals = loadLogs().filter(l => l.date === today && l.type === "actual");
      if(!todayActuals.length) return 0;
      const summary = loadDailySummaries().find(s => s.date === today);
      const scoredIds = new Set((summary && summary.scores ? summary.scores : []).filter(s=>s.score!=null).map(s => s.logId));
      return todayActuals.filter(l => !scoredIds.has(l.id)).length;
    }
    function updateTodayBadge(){
      const tab = document.querySelector('.bottom-nav .nav-tab[data-tab="today"]');
      if(!tab) return;
      // 既存バッジ削除
      const old = tab.querySelector(".tab-badge");
      if(old) old.remove();
      const n = countUnscoredTodayActuals();
      if(n > 0){
        const badge = document.createElement("span");
        badge.className = "tab-badge";
        badge.textContent = n > 9 ? "9+" : String(n);
        tab.appendChild(badge);
      }
    }
    updateTodayBadge();
    // データ変更時にバッジ更新するため、saveJSON経由で書き込まれた直後に再計算
    // シンプルに1秒ごとに更新（軽量）
    setInterval(updateTodayBadge, 5000);

    // ============================================================
    // ホーム画面に追加 促進バナー（初回起動から5回後 or 累計ログ3件以上で表示）
    // ユーザーが「あとで」「追加した」「興味なし」を選べる
    // ============================================================
    const PWA_BANNER_KEY = "lifelogPwaBannerStateV1";
    function getPwaBannerState(){ try { return JSON.parse(localStorage.getItem(PWA_BANNER_KEY)) || {}; } catch { return {}; } }
    function setPwaBannerState(s){ localStorage.setItem(PWA_BANNER_KEY, JSON.stringify(s)); }
    function isStandalone(){
      return (window.navigator.standalone === true) ||
             (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    }
    function checkPwaBanner(){
      if(isStandalone()) return; // 既にPWAとして起動中なら表示しない
      const state = getPwaBannerState();
      if(state.dismissed || state.installed) return;
      // 起動回数カウント
      state.launches = (state.launches || 0) + 1;
      setPwaBannerState(state);
      // 表示条件：起動3回以上 or ログ3件以上
      const logCount = loadLogs().length;
      if(state.launches < 3 && logCount < 3) return;
      // 一度表示したら次回まで間を空ける（前回表示から3日経過）
      if(state.lastShownAt){
        const last = new Date(state.lastShownAt).getTime();
        if(Date.now() - last < 3 * 24 * 60 * 60 * 1000) return;
      }
      showPwaBanner();
      state.lastShownAt = new Date().toISOString();
      setPwaBannerState(state);
    }
    function showPwaBanner(){
      if(document.getElementById("pwaBanner")) return;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const banner = document.createElement("div");
      banner.id = "pwaBanner";
      banner.className = "pwa-banner";
      banner.innerHTML = `
        <div class="pwa-banner-icon">📱</div>
        <div class="pwa-banner-body">
          <div class="pwa-banner-title">ホーム画面に追加できます</div>
          <div class="pwa-banner-text">${isIOS
            ? "Safariの共有ボタン <span style='font-weight:800;'>(↑)</span> →「ホーム画面に追加」でアプリのように使えます。"
            : "ブラウザのメニューから「ホーム画面に追加」または「インストール」を選べます。"
          }</div>
        </div>
        <button class="pwa-banner-close" onclick="dismissPwaBanner()" aria-label="閉じる">×</button>
      `;
      document.body.appendChild(banner);
    }
    function dismissPwaBanner(){
      const banner = document.getElementById("pwaBanner");
      if(banner) banner.remove();
      const state = getPwaBannerState();
      state.dismissed = true;
      setPwaBannerState(state);
    }
    // 起動から少し遅れて判定（他のUI描画優先）
    setTimeout(checkPwaBanner, 2500);
  </script>
</body>
